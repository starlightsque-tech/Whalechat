App.placeOrder = async function () {
  const u = me();
  clearErrors();
  const fullName = document.getElementById('ckName').value.trim();
  const phone = document.getElementById('ckPhone').value.trim();
  const email = document.getElementById('ckEmail').value.trim();
  const country = document.getElementById('ckCountry').value.trim();
  const address = document.getElementById('ckAddress').value.trim();
  const conf = document.getElementById('ckConfirm').checked;
  if (fullName.length < 3) return formError('ckName', 'Enter the receiver full name');
  if (phone.replace(/\D/g, '').length < 7) return formError('ckPhone', 'Enter a valid phone number');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return formError('ckEmail', 'Enter a valid email');
  if (country.length < 2) return formError('ckCountry', 'Enter your country');
  if (address.length < 8) return formError('ckAddress', 'Enter your full house address');
  if (!conf) return toast('Please confirm your delivery details', 'err');

  const items = (u.cart || []).map(c => ({ ...c, p: DB.products.find(p => p.id === c.productId) })).filter(x => x.p);
  if (!items.length) return toast('Cart is empty', 'err');
  const totalUsd = items.reduce((s, x) => s + x.p.priceUsd * x.qty, 0);
  const totalCoins = Math.round(totalUsd / COIN_USD * 100) / 100;
  if (u.balance < totalCoins) return toast('Insufficient balance — deposit Whale Coin first', 'err');

  // stock check
  for (const it of items) if (it.qty > it.p.stock) return toast(`Only ${it.p.stock} of ${it.p.name} left`, 'err');

  // group by vendor
  const groups = {};
  items.forEach(it => { const k = it.p.vendorId; (groups[k] = groups[k] || []).push(it); });
  const created = [];
  Object.keys(groups).forEach(vid => {
    const v = vendorById(vid);
    if (!v) return;
    const gItems = groups[vid];
    const gUsd = gItems.reduce((s, x) => s + x.p.priceUsd * x.qty, 0);
    const gCoins = Math.round(gUsd / COIN_USD * 100) / 100;
    const off = delivery(fullName, phone, email, country, address);
    const order = {
      id: uid('ord'), ref: 'WC-' + Math.random().toString(36).slice(2, 7).toUpperCase(),
      buyerId: u.id, vendorId: vid,
      items: gItems.map(x => ({ productId: x.p.id, name: x.p.name, qty: x.qty, priceUsd: x.p.priceUsd, image: x.p.image, emoji: x.p.emoji, category: x.p.category })),
      totalUsd: Math.round(gUsd * 100) / 100, totalCoins: gCoins,
      delivery: off, status: 'processing', createdAt: Date.now(), payment: 'whale_coin',
      timeline: [{ status: 'processing', at: Date.now(), note: 'Order placed and awaiting team review.' }]
    };
    DB.orders.unshift(order);
    created.push(order);
    // stock + vendor credit
    gItems.forEach(x => {
      x.p.stock = Math.max(0, x.p.stock - x.qty);
      if (x.p.stock === 0) x.p.active = false;
    });
    const vu = findUser(v.userId);
    if (vu) {
      vu.balance = Math.round((vu.balance + gCoins) * 100) / 100;
      vu.totalEarnings = Math.round(((vu.totalEarnings || 0) + gCoins) * 100) / 100;
      v.sales = (v.sales || 0) + 1;
      v.revenue = Math.round(((v.revenue || 0) + gUsd) * 100) / 100;
      tx(vu.id, 'sale', 'Sale · ' + order.ref, gCoins);
      notify(vu.id, 'Your product was purchased 🎉', `${gItems[0].name}${gItems.length > 1 ? ' +' + (gItems.length - 1) + ' more' : ''} · ${coins(gCoins)} WC credited to your balance.`, '#/vendor/orders', 'bag');
    }
    notify('usr_admin', 'New order · ' + order.ref, `${items.length} item(s) from ${esc(v.username)} — delivery details attached.`, '#/admin/orders', 'truck');
  });

  u.balance = Math.round((u.balance - totalCoins) * 100) / 100;
  u.cart = [];
  tx(u.id, 'purchase', 'Order ' + (created[0] ? created[0].ref : ''), -totalCoins);
  notify(u.id, 'Request processing', 'Your request is being processed. Please wait for our team to proceed. You can track your package movements anytime.', '#/orders', 'truck');
  sync();
  const total = created.reduce((s, o) => s + o.totalCoins, 0);
  openModal(modalShell('Request processing', `
    <div class="center" style="padding:6px 0 4px">
      <div style="width:64px;height:64px;border-radius:50%;background:rgba(46,230,201,.14);color:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto">${ic('check', 30)}</div>
      <h3 class="mt16" style="font-size:18px">Your request is being processed</h3>
      <p class="small muted mt10" style="line-height:1.7">Please wait for our team to proceed. We've reserved ${coins(total)} WC from your wallet and notified the vendor.</p>
      <div class="panel mt16" style="padding:12px;text-align:left">
        ${created.map(o => `<div class="between" style="padding:5px 0"><span class="tiny muted">${esc(o.ref)}</span><span class="small" style="font-weight:600">${coins(o.totalCoins)} WC</span></div>`).join('')}
      </div>
    </div>`,
    `<button class="btn btn-ghost" data-close style="flex:1">Keep shopping</button>
     <a href="#/orders" class="btn btn-primary" data-close style="flex:1">${ic('truck', 15)} Track package</a>`), { locked: false, width: '430px' });
  setTimeout(() => { if (me()) render(); }, 100);
};
function delivery(fullName, phone, email, country, address) {
  return { fullName, phone, email, country, address };
}

  const u = me(); clearErrors();

  if (!/^[a-zA-Z0-9._-]{3,24}$/.test(name)) return formError('vName', '3–24 characters: letters, numbers, dot, dash or underscore');

App.buyCompany = function (id) {

      <div class="between"><span class="tiny muted">Total cost</span><span id="bqTotal" style="font-weight:700">${coins(p.priceUsd / COIN_USD)} WC</span></div>
      <div class="between mt6"><span class="tiny muted">Your balance</span><span class="tiny" style="font-weight:600">${coins(u.balance)} WC</span></div>
      <div class="between mt6"><span class="tiny muted">After purchase</span><span id="bqAfter" class="tiny" style="font-weight:600">${coins(u.balance - p.priceUsd / COIN_USD)} WC</span></div>
    </div>`,
    `<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" data-act="confirm-company" data-id="${p.id}">Confirm purchase</button>`));
  const upd = () => {
    const q = Math.max(1, Math.min(p.stock, Number(document.getElementById('bq').value) || 1));
    const total = p.priceUsd * q / COIN_USD;
    document.getElementById('bqTotal').textContent = coins(total) + ' WC';
    document.getElementById('bqAfter').textContent = coins(u.balance - total) + ' WC';
    document.getElementById('bqAfter').style.color = (u.balance - total) < 0 ? 'var(--danger)' : 'var(--text)';
  };

};
App.confirmCompany = function (id) {
  const u = me(); const p = DB.companyProducts.find(x => x.id === id);
  const v = vendorOf(u.id);
  if (!p || !v) return;
  const q = Math.max(1, Math.min(p.stock, Number(document.getElementById('bq').value) || 1));
  const totalUsd = p.priceUsd * q;
  const totalCoins = Math.round(totalUsd / COIN_USD * 100) / 100;
  if (u.balance < totalCoins) return toast('Insufficient balance — deposit Whale Coins first', 'err');
  u.balance = Math.round((u.balance - totalCoins) * 100) / 100;
  p.stock -= q;
  const existing = DB.products.find(x => x.vendorId === v.id && x.companyProductId === p.id && !x.active);
  if (existing) existing.stock += q;
  else DB.products.push({
    id: uid('prd'), vendorId: v.id, companyProductId: p.id, name: p.name, category: p.category,
    priceUsd: null, costUsd: p.priceUsd, stock: q, image: p.image, emoji: p.emoji,
    description: p.description, active: false, starUsers: [], stars: 0, createdAt: Date.now()
  });
  DB.purchases = DB.purchases || [];
  DB.purchases.unshift({ id: uid('buy'), vendorId: v.id, productId: p.id, name: p.name, qty: q, totalUsd, totalCoins, createdAt: Date.now() });
  tx(u.id, 'stock', 'Company stock · ' + p.name + ' ×' + q, -totalCoins);
  notify('usr_admin', 'Vendor stock purchase', `@${v.username} bought ${q} × ${p.name} (${coins(totalCoins)} WC).`, '#/admin/products', 'box');
  notify(u.id, 'Stock added to inventory', `${q} × ${p.name} is ready. Set a selling price to publish it.`, '#/vendor/products', 'tag');
  sync(); closeModal(); toast('Stock purchased — set a selling price', 'ok'); go('vendor/products');
};

App.saveListing = function (id) {
  const u = me(); const p = DB.products.find(x => x.id === id);
  if (!p) return;
  const usdVal = Math.round(Number(document.getElementById('sellUsd').value) * 100) / 100;
  const qty = Math.max(0, Math.min(p.stock, Number(document.getElementById('sellQty').value) || 0));
  if (!(usdVal > 0)) return toast('Enter a selling price', 'err');
  p.priceUsd = usdVal;
  if (qty < p.stock) {
    // keep the unlisted remainder as a separate hidden inventory record
    DB.products.push({
      id: uid('prd'), vendorId: p.vendorId, companyProductId: p.companyProductId,
      name: p.name, category: p.category, priceUsd: null, costUsd: p.costUsd,
      stock: p.stock - qty, image: p.image, emoji: p.emoji, description: p.description,
      active: false, starUsers: [], stars: 0, createdAt: Date.now()
    });
  }
  p.stock = qty;
  p.active = qty > 0;
  sync(); closeModal();
  toast(p.active ? 'Listed on the public marketplace' : 'Listing saved (hidden — no stock)', 'ok');
  render();
};

App.submitDeposit = function (mode) {
  const u = me(); clearErrors();
  const usdAmt = Math.round(Number(document.getElementById('depUsd').value) * 100) / 100;
  if (!(usdAmt >= 1)) return formError('depUsd', 'Enter at least $1');
  let methodName = '', detail = '';
  if (mode === 'crypto') {
    const sel = document.querySelector('input[name="depm"]:checked');
    if (!sel) return toast('Select a crypto payment method', 'err');
    const m = (DB.settings.crypto || []).find(x => x.id === sel.value);
    methodName = m ? m.name : 'Crypto';
    detail = m ? m.address : '';
  } else {
    methodName = 'Bank transfer';
    detail = (document.getElementById('depRef') || {}).value || '';
    if (!(DB.settings.banks || []).length) return toast('No bank details configured', 'err');
  }
  DB.deposits.unshift({
    id: uid('dep'), userId: u.id, usd: usdAmt, coins: usdToCoins(usdAmt),
    method: mode, methodName, detail, status: 'pending', createdAt: Date.now(), note: ''
  });
  notify('usr_admin', 'New deposit request', `${u.fullName} (@${u.username}) submitted ${usd(usdAmt)} via ${methodName}.`, '#/admin/deposits', 'wallet');
  notify(u.id, 'Deposit submitted', `Your ${usd(usdAmt)} deposit is pending review. You'll be credited ${coins(usdToCoins(usdAmt))} WC once approved.`, '#/wallet', 'wallet');
  sync();
  openModal(modalShell('Deposit submitted', `
    <div class="center">
      <div style="width:58px;height:58px;border-radius:50%;background:rgba(255,176,32,.14);color:var(--warn);display:flex;align-items:center;justify-content:center;margin:0 auto">${ic('clock', 26)}</div>

    </div>`,
    `<a href="#/wallet" class="btn btn-primary" data-close style="width:100%">Back to wallet</a>`));

};

App.submitWithdraw = async function () {
  const u = me(); clearErrors();
  const net = document.getElementById('wdNet').value;
  const addr = document.getElementById('wdAddr').value.trim();
  const amt = Math.round((Number(document.getElementById('wdCoins').value) || 0) * 100) / 100;
  const pin = document.getElementById('wdPin').value;
  if (!addr || addr.length < 12) return formError('wdAddr', 'Enter a valid USDT wallet address');
  if (!(amt >= 5)) return formError('wdCoins', 'Minimum withdrawal is 5 WC');
  if (amt > u.balance) return formError('wdCoins', 'Amount exceeds your available balance');
  if (!/^\d{4,6}$/.test(pin)) return formError('wdPin', 'Enter your 4–6 digit PIN');
  if (!document.getElementById('wdConfirm').checked) return toast('Please confirm the wallet address', 'err');
  if (await hash('pin::' + pin) !== u.pin) return formError('wdPin', 'Incorrect PIN');
  u.balance = Math.round((u.balance - amt) * 100) / 100;
  DB.withdrawals.unshift({
    id: uid('wd'), userId: u.id, network: net, address: addr, coins: amt,
    usd: coinsToUsd(amt), status: 'pending', createdAt: Date.now(), note: ''
  });
  tx(u.id, 'withdrawal', 'Withdrawal request · ' + net, -amt);
  notify('usr_admin', 'New withdrawal request', `${u.fullName} requested ${coins(amt)} WC (${usd(coinsToUsd(amt))}) via ${net}.`, '#/admin/withdrawals', 'download');
  notify(u.id, 'Withdrawal submitted', `Your request for ${coins(amt)} WC is pending review.`, '#/wallet', 'download');
  sync();
  openModal(modalShell('Withdrawal requested', `
    <div class="center"><div style="width:58px;height:58px;border-radius:50%;background:rgba(46,230,201,.14);color:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto">${ic('check', 26)}</div>

    `<a href="#/wallet" class="btn btn-primary" data-close style="width:100%">Done</a>`));
  setTimeout(() => render(), 60);
};

function fileToDataURL(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
}

App.adminSaveUser = function (id) {
  const x = findUser(id); if (!x) return;
  const bal = Number(document.getElementById('auBal').value);
  const trust = Number(document.getElementById('auTrust').value);
  const sales = Number(document.getElementById('auSales').value);
  const earn = Number(document.getElementById('auEarn').value);
  if (isNaN(bal) || bal < 0) return toast('Invalid balance', 'err');
  const diff = Math.round((bal - x.balance) * 100) / 100;
  x.balance = Math.round(bal * 100) / 100;
  x.trustScore = Math.max(0, Math.min(100, trust || 0));
  x.completedSales = Math.max(0, sales || 0);
  x.totalEarnings = Math.round((earn || 0) * 100) / 100;
  if (diff) tx(x.id, diff > 0 ? 'deposit' : 'withdrawal', 'Admin balance adjustment', diff);
  notify(x.id, 'Account updated', 'Your account settings were updated by the WhaleChat team.', '#/profile', 'settings');
  sync(); closeModal(); toast('User updated', 'ok'); render();
};

  u.balance = Math.round((u.balance + d.coins) * 100) / 100;
  u.totalDeposits = Math.round(((u.totalDeposits || 0) + d.usd) * 100) / 100;
  tx(u.id, 'deposit', 'Deposit approved · ' + (d.methodName || d.method), d.coins);
  notify(u.id, 'Deposit approved ✅', `${coins(d.coins)} WC has been credited to your wallet.`, '#/wallet', 'wallet');
  // referral payout on first approved deposit
  if (!u.referralPaid && u.referredBy) {
    const ref = findUser(u.referredBy);
    if (ref) {
      ref.balance = Math.round((ref.balance + 10) * 100) / 100;
      ref.totalEarnings = Math.round(((ref.totalEarnings || 0) + 10) * 100) / 100;
      tx(ref.id, 'referral', 'Referral reward · @' + u.username, 10);
      notify(ref.id, 'Referral reward 🎁', `You earned 10 Whale Coins because @${u.username} made their first deposit.`, '#/referrals', 'gift');
    }
    u.referralPaid = true;
    DB.referrals.push({ id: uid('rf'), inviterId: u.referredBy, userId: u.id, coins: 10, createdAt: Date.now() });
  }
  sync(); toast('Deposit approved and credited', 'ok'); render();
};

function camel(act) {
  return act.replace(/-([a-z])/g, (m, c) => c.toUpperCase());
}
const ACTION_ALIASES = {
  'admin-del-user': 'adminDeleteUser',
  'admin-notif-edit': 'adminNotifEdit',
  'admin-notif-del': 'adminNotifDel',
  'admin-notif-save': 'adminNotifSave',
  'admin-product-del': 'adminProductDel',
  'admin-send-notif': 'adminSendNotif',
  'admin-test-notif': 'adminTestNotif',
  'admin-user': 'adminUser',
  'admin-order-del': 'adminOrderDel',
  'admin-order-save': 'adminOrderSave',
  'admin-export': 'adminExport',
  'admin-notify-user': 'adminNotifyUser',
  'edit-msg': 'editMessage',
  'copy-msg': 'copyMessage',
  'delete-msg': 'deleteMessage',
  'forward-msg': 'forwardMessage',
  'avatar-camera': 'avatarCamera'
};

document.addEventListener('click', function (ev) {
  const nav = ev.target.closest('[data-nav]');
  if (nav) {
    ev.preventDefault();
    const h = nav.getAttribute('data-nav');
    go(h.replace(/^#\/?/, ''));
    return;
  }
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const act = el.getAttribute('data-act');
  if (!act) return;
  const ds = Object.assign({}, el.dataset);
  ev.preventDefault();
  // special multi-arg handlers
  if (act === 'cart-qty') return App.cartQty(ds.id, ds.d);
  if (act === 'remove-media') return App.removeMedia(Number(ds.idx));
  if (act === 'do-forward') return App.doForward(ds.id, ds.msg);
  if (act === 'send-status-reply') return;
  if (act === 'back') return App.back();
  if (act === 'toggle-theme') return App.toggleTheme();
  if (act === 'set-pin-now') return App.setPinNow();
  if (act === 'status-step') return App.statusStep(Number(ds.d));
  const name = ACTION_ALIASES[act] || camel(act);
  const fn = App[name];
  if (typeof fn === 'function') {
    try { fn(ds.id, ds, ev); }
    catch (err) { console.error('Action failed', act, err); toast('Something went wrong. Please try again.', 'err'); }
  } else {
    console.warn('No handler for action:', act, name);
  }
}, false);

document.addEventListener('keydown', (e) => {

  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {

    const s = document.getElementById('globalSearch');
    if (s) s.focus();
  }
});

App.avatarCamera = function () { App.avatarUpload(true); };

App.mobileSearch = function () {
  openModal(modalShell('Search WhaleChat', `
    <div class="searchbar" style="height:46px">${ic('search', 17)}<input id="msInput" placeholder="People, chats, products…" autocomplete="off"/></div>
    <div class="mt16" id="msResults"><p class="small muted">Type to search people, contacts and products.</p></div>`,
    `<button class="btn btn-ghost" data-close style="width:100%">Close</button>`));
  const i = document.getElementById('msInput');
  setTimeout(() => i.focus(), 80);
  i.addEventListener('keydown', (e) => { if (e.key === 'Enter' && i.value.trim()) { closeModal(); App.openSearch(i.value.trim()); } });
};

App.adminNotifyUser = async function (id) {
  const u = findUser(id); if (!u) return;
  const title = await promptDialog({ title: 'Send notification', label: 'Title', placeholder: 'Account update' });
  if (!title) return;
  const body = await promptDialog({ title: 'Send notification', label: 'Message', placeholder: 'Write the message…' });
  if (!body) return;
  notify(id, title, body, null, 'bell');
  sync(); toast('Notification sent to ' + u.fullName, 'ok'); render();
};

App.adminExport = function (type) {
  if (type !== 'users') return;
  const rows = [['Full name', 'Username', 'Email', 'Phone', 'Balance (WC)', 'Trust', 'Vendor', 'Banned', 'Joined']];
  DB.users.filter(u => u.role !== 'admin').forEach(u => rows.push([u.fullName, u.username, u.email, u.phone || '', u.balance, u.trustScore, vendorOf(u.id) ? 'yes' : 'no', u.banned ? 'yes' : 'no', new Date(u.createdAt).toISOString()]));
  const csv = rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'whalechat-users.csv';
  document.body.appendChild(a); a.click(); a.remove();
  toast('Export downloaded', 'ok');
};

/* Vendor sub-route dispatch */
const __vendorBase = VIEWS.vendor;
VIEWS.vendor = function (parts, params) {
  const sub = parts[1];
  if (sub === 'company') return VIEWS.vendor_company(parts, params);
  if (sub === 'products') return VIEWS.vendorProducts(parts, params);
  if (sub === 'orders') return VIEWS.vendorOrders(parts, params);
  if (sub === 'history') return VIEWS.vendorHistory(parts, params);
  return __vendorBase(parts, params);
};

/* boot */
async function boot() {
  await initDB();
  if (SESSION) {
    const u = me();
    if (!u) { SESSION = null; localStorage.removeItem(LS_SESSION); }
    else if (u.pin) Presence.touch();
  }
  initTheme();
  const hasHash = !!location.hash;
  if (!hasHash) {
    renderSplash();
    setTimeout(() => {
      const u = me();
      if (u) go(u.role === 'admin' ? 'admin' : 'home');
      else go('welcome');
    }, 1200);
  } else {
    render();
  }
  // service worker (best effort — needs https / localhost)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
  // periodic maintenance (status expiry, delivery ack, unread badge)
  setInterval(() => {
    if (!me()) return;
    if (DB.statuses.some(s => s.createdAt + 86400000 < Date.now())) {
      DB.statuses = DB.statuses.filter(s => s.createdAt + 86400000 > Date.now());
      persist(); render();
    }
    if ('setAppBadge' in navigator) {
      const n = totalUnread() + unreadNotifs();
      try { n ? navigator.setAppBadge(n) : navigator.clearAppBadge(); } catch (e) {}
    }
  }, 30000);
}

window.addEventListener('DOMContentLoaded', boot);
</script>
