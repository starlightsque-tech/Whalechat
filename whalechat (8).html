AFTER.home = function () { ACTIVE_CHAT = null; };

/* ---------------- contacts ---------------- */
VIEWS.contacts = function () {
  const u = me();
  const cs = myContacts(u.id);
  return `<div class="page-head"><div><h1>Contacts</h1><p>People you can chat with on WhaleChat.</p></div>
    <button class="btn btn-primary btn-sm" data-act="add-contact">${ic('plus', 15)} Add contact</button></div>
    ${cs.length ? `<div class="list">${cs.map(c => `<div class="list-item">
      ${avatarHTML(c)}
      <div class="grow"><div style="font-weight:600;font-size:14px">${esc(c.fullName)} ${c.verified ? `<span class="verified" style="vertical-align:middle">${ic('check', 9)}</span>` : ''}</div>
      <div class="tiny muted">@${esc(c.username)} · ${esc(c.phone || '')}</div></div>
      <button class="btn btn-sm btn-ghost" data-act="open-chat" data-id="${c.id}">${ic('chat', 15)} Chat</button>
      <button class="btn-icon" data-act="contact-menu" data-id="${c.id}" style="width:36px;height:36px">${ic('more', 16)}</button>
    </div>`).join('')}</div>` : `<div class="empty"><div class="ic">${ic('users', 26)}</div><h3>No contacts saved</h3><p>Search by username, phone number or email to add someone.</p><button class="btn btn-primary" data-act="add-contact">Add contact</button></div>`}`;
};

App.addContact = function () {
  openModal(modalShell('Add a contact', `
    <div class="field"><label class="label">Find by username, phone or email</label>
      <div class="input-wrap"><span class="ic">${ic('search', 17)}</span><input class="input" id="acq" placeholder="e.g. janedoe, +1555…, you@email.com" autocomplete="off"/></div>
      <div class="help">You can only message people you have saved.</div></div>
    <div id="acResults"></div>`,
    `<button class="btn btn-ghost" data-close>Cancel</button>`));
  const inp = document.getElementById('acq');
  const box = document.getElementById('acResults');
  const u = me();
  const run = () => {
    const q = inp.value.trim().toLowerCase();
    if (!q) { box.innerHTML = ''; return; }
    const results = DB.users.filter(x => x.id !== u.id && !x.banned && (
      x.username.toLowerCase().includes(q) || x.email.toLowerCase() === q ||
      (x.phone || '').replace(/\s/g, '').includes(q.replace(/\s/g, '')) || x.fullName.toLowerCase().includes(q)));
    box.innerHTML = results.length ? `<div class="list">${results.slice(0, 8).map(x => {
      const added = isContact(u.id, x.id);
      return `<div class="list-item">${avatarHTML(x, 'sm')}
        <div class="grow"><div class="small" style="font-weight:600">${esc(x.fullName)}</div><div class="tiny muted">@${esc(x.username)}</div></div>
        <button class="btn btn-sm ${added ? 'btn-ghost' : 'btn-primary'}" data-act="${added ? 'open-chat' : 'save-contact'}" data-id="${x.id}">${added ? 'Chat' : 'Add'}</button></div>`;
    }).join('')}</div>` : `<div class="center muted small" style="padding:18px 0">No matches. Check the username or phone number.${!Remote.enabled ? '<div class="tiny" style="margin-top:8px;color:var(--warn)">Single-device mode: only accounts created on this device can be found.</div>' : ''}</div>`;
  };
  inp.addEventListener('input', run);
  setTimeout(() => inp.focus(), 80);
};

App.saveContact = function (id) {
  const u = me();
  const x = findUser(id);
  if (!x) return;
  if (isContact(u.id, id)) { closeModal(); return go('chat/' + id); }
  DB.contacts.push({ id: uid('ct'), ownerId: u.id, userId: id, createdAt: Date.now() });
  // reciprocal so both sides can talk
  if (!isContact(id, u.id)) DB.contacts.push({ id: uid('ct'), ownerId: id, userId: u.id, createdAt: Date.now() });
  notify(id, 'New contact', `${u.fullName} (@${u.username}) added you to their WhaleChat contacts.`, '#/home', 'users');
  sync(); closeModal(); toast('Contact added', 'ok'); go('chat/' + id);
};

App.contactMenu = function (id) {
  const u = me(); const c = findUser(id);
  if (!c) return;
  openModal(modalShell(c.fullName, `
    <div class="list">
      <button class="list-item" data-act="open-chat" data-id="${id}" style="width:100%;text-align:left">${ic('chat', 17)} <span class="grow">Open chat</span></button>
      <button class="list-item" data-act="delete-contact" data-id="${id}" style="width:100%;text-align:left;color:var(--danger)">${ic('trash', 17)} <span class="grow">Remove contact</span></button>
    </div>`, `<button class="btn btn-ghost" data-close style="width:100%">Close</button>`, '@' + c.username));
};
App.deleteContact = async function (id) {
  const u = me();
  if (!await confirmDialog({ title: 'Remove contact?', body: 'They will be removed from your contact list. Your chat history stays on your account.', danger: true, ok: 'Remove' })) return;
  DB.contacts = DB.contacts.filter(c => !(c.ownerId === u.id && c.userId === id));
  sync(); closeModal(); toast('Contact removed', 'ok'); render();
};

/* ---------------- CHAT ROOM ---------------- */
VIEWS.chat = function (parts) {
  const u = me();
  const other = findUser(parts[1]);
  if (!other) return `<div class="empty"><h3>Conversation not found</h3><button class="btn btn-primary" data-nav="#/home">Back</button></div>`;
  if (!isContact(u.id, other.id) && other.role !== 'admin' && u.role !== 'admin') {
    return `<div class="empty"><div class="ic">${ic('lock', 24)}</div><h3>You need to add ${esc(other.fullName)} first</h3>
      <p>WhaleChat only allows conversations between saved contacts.</p><button class="btn btn-primary" data-act="save-contact" data-id="${other.id}">Add contact</button></div>`;
  }
  const cid = chatId(u.id, other.id);
  ACTIVE_CHAT = cid;
  const msgs = chatMessages(cid);
  const meta = DB.chatsMeta[cid] || {};
  const muted = (meta.muted || []).includes(u.id);
  const blocked = isBlocked(u.id, other.id);
  const online = Presence.isOnline(other.id);
  const comp = COMPOSE[cid] || { text: '', media: [] };
  const typing = TYPING[cid] && TYPING[cid][other.id] && Date.now() - TYPING[cid][other.id] < 4000;

  let body = '', lastDay = '';
  msgs.forEach((m) => {
    const dl = timeDivider(m.createdAt);
    if (dl !== lastDay) { body += `<div class="day-sep">${dl}</div>`; lastDay = dl; }
    body += messageHTML(m, u, other);
  });
  if (!msgs.length) body = `<div class="chat-empty-hint">🔒 Messages are private between you and ${esc(other.fullName.split(' ')[0])}. Say hello to get started.</div>`;

  const editMsg = EDITING ? DB.messages.find(m => m.id === EDITING) : null;

  return `<div class="chat-room">
    <div class="chat-head">
      <button class="btn-icon" data-nav="#/home" style="width:36px;height:36px">${ic('back', 18)}</button>
      <div class="avatar-wrap" data-act="view-profile" data-id="${other.id}" style="cursor:pointer">${avatarHTML(other, 'sm')}${online ? '<span class="status-dot" style="width:10px;height:10px"></span>' : ''}</div>
      <div class="grow" data-act="view-profile" data-id="${other.id}" style="cursor:pointer;min-width:0">
        <div class="row gap6" style="font-weight:650;font-size:14.5px">${esc(other.fullName)} ${other.verified ? `<span class="verified">${ic('check', 9)}</span>` : ''}</div>
        <div class="tiny" style="color:${typing ? 'var(--accent)' : 'var(--muted)'}">${typing ? 'typing…' : online ? 'online' : 'last seen ' + (Presence.lastSeen(other.id) ? timeAgo(Presence.lastSeen(other.id)) + ' ago' : 'recently')}
          ${muted ? ' · muted' : ''}</div>
      </div>
      <button class="btn-icon" data-act="chat-menu" data-id="${other.id}" style="width:36px;height:36px">${ic('more', 18)}</button>
    </div>
    <div class="chat-body" id="chatBody">
      ${body}
      ${typing ? `<div class="typing"><i></i><i></i><i></i></div>` : ''}
    </div>
    ${other.role === 'admin' && supportWaiting(cid) ? `<div class="support-live" id="supportLiveCallout">
      <div class="row gap10" style="align-items:flex-start">
        <span style="width:34px;height:34px;border-radius:10px;background:rgba(46,230,201,.15);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none">${ic('help', 17)}</span>
        <div><div class="small" style="font-weight:650">Still waiting for a reply?</div>
        <div class="tiny muted mt6" style="line-height:1.55">Our team hasn't responded for 10 minutes. Connect to our customer support team on live chat for an immediate answer.</div></div>
      </div>
      <div class="row gap8 mt10"><button class="btn btn-primary btn-sm" data-act="live-chat">${ic('chat', 14)} Connect on live chat</button>

};

function waveform(id, n = 22) {
  let h = 0; for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) % 9973;
  let out = '';
  for (let i = 0; i < n; i++) {
    h = (h * 1103515245 + 12345) % 2147483647;
    const v = 5 + (h % 18);
    out += `<i style="height:${v}px"></i>`;
  }
  return out;
}
function reactionCounts(reactions) {
  const out = {};
  Object.keys(reactions || {}).forEach(k => { const e = reactions[k]; if (e) out[e] = (out[e] || 0) + 1; });
  return out;
}
function reactionChips(reactions, meId, kind, id) {
  const counts = reactionCounts(reactions);
  const keys = Object.keys(counts);
  if (!keys.length) return '';
  const mine = (reactions || {})[meId];
  return `<div class="react-row">${keys.map(e => `<button class="react-chip ${mine === e ? 'mine' : ''}" data-act="react-${kind}" data-id="${id}" data-emoji="${e}" title="React">${e}${counts[e] > 1 ? ' ' + counts[e] : ''}</button>`).join('')}</div>`;
}
function messageHTML(m, u, other) {
  const out = m.from === u.id;
  const showFwd = m.forwarded && m.type !== 'audio'; // audio forwards intentionally look normal
  let content = '';
  if (m.type === 'image') {
    content = `<img class="chat-media skeleton" data-media="${m.mediaId}" style="min-height:120px" alt="Photo" data-act="view-media" data-id="${m.id}"/>`;
  } else if (m.type === 'video') {
    content = `<video class="chat-media" data-media="${m.mediaId}" controls playsinline preload="metadata" style="min-height:120px"></video>`;
  } else if (m.type === 'audio') {
    content = `<div class="audio-player" data-audio="${m.id}">
      <button class="ap-btn" data-act="play-audio" data-id="${m.id}">${ic('play', 14)}</button>
      <div class="wave">${waveform(m.id, 24)}</div>
      <span class="tiny muted" style="min-width:30px;text-align:right" data-dur="${m.id}">${m.dur ? Math.round(m.dur) + 's' : '0s'}</span>
      <audio data-media="${m.mediaId}" preload="metadata" style="display:none"></audio>
    </div>`;
  }
  return `<div class="msg ${out ? 'out' : 'in'}" data-msg="${m.id}" data-mine="${out ? 1 : 0}" data-type="${m.type}" data-at="${m.createdAt}">
    ${!out && other.role === 'admin' ? '' : ''}
    ${showFwd ? `<div class="fwd">${ic('forward', 11)} Forwarded</div>` : ''}
    ${m.replyText ? `<div class="tiny" style="border-left:2px solid var(--accent);padding-left:7px;margin-bottom:4px;opacity:.8">${esc(m.replyText).slice(0, 90)}</div>` : ''}
    ${content}
    ${m.text ? `<div class="txt">${linkify(esc(m.text))}</div>` : ''}
    <div class="meta">
      ${m.editedAt ? '<span class="edited">Edited</span>' : ''}
      <span>${clockTime(m.createdAt)}</span>
      ${out ? `<span class="tick ${m.status === 'seen' ? 'seen' : ''}" title="${m.status === 'seen' ? 'Read' : 'Sent'}">${ic(m.status === 'seen' ? 'checks' : 'check', 12)}</span>` : ''}
    </div>
    ${reactionChips(m.reactions, u.id, 'msg', m.id)}
  </div>`;
}
function linkify(escaped) {
  return escaped.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener" style="color:var(--accent-2);text-decoration:underline">$1</a>');
}

let SUPPORT_TIMER = null;
AFTER.chat = function (parts) {
  ACTIVE_CHAT = chatId(me().id, parts[1]);
  const otherUser = findUser(parts[1]);
  clearInterval(SUPPORT_TIMER);
  if (otherUser && otherUser.role === 'admin') {
    SUPPORT_TIMER = setInterval(() => {
      if (!ACTIVE_CHAT) { clearInterval(SUPPORT_TIMER); return; }
      const waiting = supportWaiting(ACTIVE_CHAT);
      const present = !!document.getElementById('supportLiveCallout');
      if (waiting !== present) render();
    }, 15000);
  }
  const body = document.getElementById('chatBody');
  if (body) body.scrollTop = body.scrollHeight;
  const inp = document.getElementById('msgInput');
  if (inp) {
    inp.focus({ preventScroll: true });
    inp.style.height = 'auto';
    inp.style.height = Math.min(120, inp.scrollHeight) + 'px';
    if (!inp.dataset.bound) {
      inp.dataset.bound = '1';
      inp.addEventListener('input', () => {
        const cid = ACTIVE_CHAT;
        COMPOSE[cid] = COMPOSE[cid] || { text: '', media: [] };
        COMPOSE[cid].text = inp.value;
        inp.style.height = 'auto';
        inp.style.height = Math.min(120, inp.scrollHeight) + 'px';
        if (chan) { try { chan.postMessage({ t: 'typing', chatId: cid, from: me().id }); } catch (e) {} }
        const has = inp.value || (COMPOSE[cid].media || []).length;
        const sendBtn = document.querySelector('[data-act="send"], [data-act="voice"]');
        if (sendBtn) {
          if (has && sendBtn.getAttribute('data-act') === 'voice') { sendBtn.outerHTML = `<button class="send-btn" data-act="send">${ic('send', 19)}</button>`; }
          if (!has && sendBtn.getAttribute('data-act') === 'send') { sendBtn.outerHTML = `<button class="icon-btn-round" data-act="voice" style="width:44px;height:44px;background:var(--surface-2)">${ic('mic', 20)}</button>`; }
        }
      });
      inp.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey && window.innerWidth > 860) { e.preventDefault(); App.send(); }
      });
    }
    // mark incoming messages seen
    const u = me(), oid = parts[1];
    const receipts = !(u.settings && u.settings.readReceipts === false);
    let changed = false;
    DB.messages.forEach(m => {
      if (m.to !== u.id) return;
      if (!isReadBy(m, u.id)) {
        m.readBy = Array.isArray(m.readBy) ? m.readBy : [];
        if (!m.readBy.includes(u.id)) m.readBy.push(u.id);
        changed = true;
      }
      // only expose the green “seen” tick when this reader allows receipts
      if (receipts && m.status !== 'seen') { m.status = 'seen'; changed = true; }
    });
    if (changed) { persist(true); notifySeen(oid); }
  }
  bindMessageGestures();
  Media.hydrate(body || document);
};
function notifySeen(otherId) {
  if (chan) { try { chan.postMessage({ t: 'seen', from: me().id, to: otherId }); } catch (e) {} }
}

function bindMessageGestures() {
  const body = document.getElementById('chatBody');
  if (!body || body.dataset.gest) return;
  body.dataset.gest = '1';
  let timer = null, target = null;
  const start = (e) => {
    const m = e.target.closest('[data-msg]');
    if (!m) return;
    target = m;
    timer = setTimeout(() => { timer = null; App.messageMenu(m.getAttribute('data-msg')); }, 430);
  };
  const cancel = () => { if (timer) { clearTimeout(timer); timer = null; } };
  body.addEventListener('pointerdown', start);
  body.addEventListener('pointerup', cancel);
  body.addEventListener('pointermove', cancel);
  body.addEventListener('pointercancel', cancel);
  body.addEventListener('contextmenu', (e) => {
    const m = e.target.closest('[data-msg]');
    if (m) { e.preventDefault(); App.messageMenu(m.getAttribute('data-msg')); }
  });
}

App.send = async function () {
  const u = me();
  if (!u || !ACTIVE_CHAT) return;
  const cid = ACTIVE_CHAT;
  const c = COMPOSE[cid] || { text: '', media: [] };
  const inp = document.getElementById('msgInput');
  const text = (inp ? inp.value : c.text || '').trim();
  const media = c.media || [];
  if (!text && !media.length) return;
  const otherId = cid.split('__').find(x => x !== u.id);

  if (EDITING) {
    const m = DB.messages.find(x => x.id === EDITING);
    if (m && Date.now() - m.createdAt < 15 * 60000) {
      m.text = text; m.editedAt = Date.now();
      EDITING = null; COMPOSE[cid] = { text: '', media: [] };
      if (inp) inp.value = '';
      sync(); toast('Message updated', 'ok');
      if (chan) { try { chan.postMessage({ t: 'message', from: u.id }); } catch (e) {} }
      render();
      return;
    }
    EDITING = null;
  }

  const base = { chatId: cid, from: u.id, to: otherId, createdAt: Date.now(), status: 'sent', deleted: false, readBy: [] };
  if (media.length) {
    media.forEach((md, i) => {
      DB.messages.push(Object.assign({}, base, {
        id: uid('msg'), type: md.type, mediaId: md.id, dur: md.dur || null,
        text: i === media.length - 1 ? text : '', forwarded: false
      }));
    });
  } else {
    DB.messages.push(Object.assign({}, base, { id: uid('msg'), type: 'text', text, forwarded: false }));
  }
  COMPOSE[cid] = { text: '', media: [] };
  if (inp) inp.value = '';
  const meta = DB.chatsMeta[cid] || {};
  if ((meta.deletedFor || []).includes(u.id)) meta.deletedFor = meta.deletedFor.filter(x => x !== u.id);
  DB.chatsMeta[cid] = meta;
  notify(otherId, u.fullName, text ? text.slice(0, 120) : (media[0].type === 'audio' ? 'Voice message' : media[0].type === 'video' ? 'Video' : 'Photo'), '#/chat/' + u.id, 'chat');
  sync();
  if (chan) { try { chan.postMessage({ t: 'message', from: u.id }); } catch (e) {} }
  render();
  setTimeout(() => { if (ACTIVE_CHAT === cid) { const b = document.getElementById('chatBody'); if (b) b.scrollTop = b.scrollHeight; } }, 30);
  // delivery ack simulation
  setTimeout(() => {
    const fresh = loadDB();
    if (!fresh) return;
    let ch = false;
    fresh.messages.forEach(m => { if (m.chatId === cid && m.from === u.id && m.status === 'sent') { m.status = 'delivered'; ch = true; } });
    if (ch) { DB = fresh; persist(); if (ACTIVE_CHAT === cid) render(); }
  }, 1200);
};

let recorder = null, recChunks = [], recStart = 0, recTimer = null;
App.voice = async function () {
  closeModal();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return toast('Voice recording is not supported here', 'err');
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { return toast('Microphone permission is required', 'err'); }
  try {
    recorder = new MediaRecorder(stream);
    recChunks = []; recStart = Date.now();
    recorder.ondataavailable = (e) => { if (e.data.size) recChunks.push(e.data); };
    recorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(recChunks, { type: recChunks[0] ? recChunks[0].type : 'audio/webm' });
      const dur = Math.max(1, Math.round((Date.now() - recStart) / 1000));
      const id = await Media.put(blob);
      COMPOSE[ACTIVE_CHAT] = COMPOSE[ACTIVE_CHAT] || { text: '', media: [] };
      COMPOSE[ACTIVE_CHAT].media.push({ id, type: 'audio', dur });
      clearInterval(recTimer); recTimer = null;
      render();
    };
    recorder.start();
    openModal(modalShell('Recording voice note', `
      <div class="center" style="padding:18px 0">
        <div class="row" style="justify-content:center;gap:9px;color:var(--danger);font-weight:600"><span class="rec-dot"></span><span id="recTime">0:00</span></div>
        <p class="small muted mt16">Speak now. Tap stop to attach the voice note.</p>
        <div class="wave" style="justify-content:center;height:40px;margin-top:14px">${waveform('rec', 30)}</div>
      </div>`, `<button class="btn btn-ghost" data-cancel-rec style="flex:1">Cancel</button><button class="btn btn-primary" data-stop-rec style="flex:1">${ic('check', 15)} Stop & attach</button>`), { locked: true });
    recTimer = setInterval(() => {
      const el = document.getElementById('recTime');
      if (el) { const s = Math.floor((Date.now() - recStart) / 1000); el.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
    }, 400);
    document.querySelector('[data-stop-rec]').onclick = () => { closeModal(); if (recorder && recorder.state !== 'inactive') recorder.stop(); };
    document.querySelector('[data-cancel-rec]').onclick = () => {
      closeModal(); clearInterval(recTimer);
      if (recorder) { recorder.onstop = null; recorder.stop(); }
      stream.getTracks().forEach(t => t.stop());
      recorder = null;
    };
  } catch (e) { stream.getTracks().forEach(t => t.stop()); toast('Could not start recording', 'err'); }
};

App.toggleBlock = async function (id) {

let STATUS_VIEW = null;
App.openStatus = function (id) {

function renderStatusViewer() {
  const v = STATUS_VIEW;
  if (!v) return;
  const old = document.getElementById('storyRoot'); if (old) old.remove();
  const s = v.items[v.idx];
  const owner = findUser(v.userId);
  if (!s || !owner) return closeViewer();
  const mine = v.userId === me().id;
  const product = s.productId ? DB.products.find(p => p.id === s.productId) : null;
  const root = document.createElement('div');
  root.className = 'story-view'; root.id = 'storyRoot';
  root.innerHTML = `
    <div class="story-bars">${v.items.map((x, i) => `<i class="${i < v.idx ? 'done' : i === v.idx ? 'on' : ''}"></i>`).join('')}</div>
    <div class="story-head">

      <button class="btn-icon" data-st-close style="background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff;width:34px;height:34px">${ic('x', 17)}</button>
    </div>
    <div class="story-stage" style="background:${s.type === 'text' ? s.bg : '#000'}">
      ${s.type === 'text' ? `<div class="story-text">${esc(s.text)}</div>` :
        s.type === 'image' ? `<img data-media="${s.mediaId}" alt="status" class="skeleton"/>` :
        `<video data-media="${s.mediaId}" autoplay playsinline controls style="max-height:100%"></video>`}
      ${s.type !== 'text' && s.text ? `<div style="position:absolute;bottom:130px;left:16px;right:16px;text-align:center;font-size:14px;text-shadow:0 2px 12px #000;padding:10px;background:rgba(0,0,0,.35);border-radius:12px">${esc(s.text)}</div>` : ''}
    </div>
    ${product ? `<div style="position:absolute;left:12px;right:12px;bottom:${mine ? '76px' : '88px'};z-index:4;background:rgba(8,22,32,.92);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:10px;display:flex;gap:10px;align-items:center;backdrop-filter:blur(10px)">
      <div style="width:44px;height:44px;border-radius:9px;overflow:hidden;flex:none;background:#0b2230;display:flex;align-items:center;justify-content:center;font-size:20px">${product.image ? `<img src="${product.image}" style="width:100%;height:100%;object-fit:cover"/>` : (product.emoji || '📦')}</div>
      <div class="grow" style="min-width:0"><div class="small" style="font-weight:600" class="ellipsis">${esc(product.name)}</div>
        <div class="tiny" style="color:var(--accent);font-weight:700">${coins(product.priceUsd / COIN_USD)} WC <span style="color:#8ba4b6;font-weight:400">${usd(product.priceUsd)}</span></div></div>
      <button class="btn btn-primary btn-sm" data-st-buy="${product.id}">Buy now</button></div>` : ''}
    <div class="story-react" style="position:absolute;left:0;right:0;bottom:${mine ? '90px' : '104px'};z-index:5">
      ${['👍','❤️','😂','😮','😢','🎉'].map(e => `<button data-act="react-status" data-id="${s.id}" data-emoji="${e}" class="${(s.reactions || {})[me().id] === e ? 'mine' : ''}">${e}</button>`).join('')}
    </div>
    ${Object.keys(reactionCounts(s.reactions)).length ? `<div class="story-react" style="position:absolute;left:0;right:0;bottom:${mine ? '58px' : '72px'};z-index:5;pointer-events:none">${reactionChips(s.reactions, me().id, 'status', s.id)}</div>` : ''}
    <div style="position:absolute;left:0;right:0;bottom:0;z-index:4;padding:10px 12px calc(12px + env(safe-area-inset-bottom));display:flex;gap:9px;align-items:center;background:linear-gradient(0deg,rgba(0,0,0,.75),transparent)">

    </div>`;
  document.body.appendChild(root);
  root.addEventListener('click', (e) => {
    if (e.target.closest('.story-react') || e.target.closest('[data-act="react-status"]')) return;
    if (e.target.closest('[data-st-close]')) return closeViewer();
    if (e.target.closest('[data-st-del]')) return App.deleteStatus(s.id);
    if (e.target.closest('[data-st-viewers]')) return App.statusViewers(s.id);
    if (e.target.closest('[data-st-buy]')) { closeViewer(); go('product/' + e.target.closest('[data-st-buy]').getAttribute('data-st-buy')); return; }
    if (e.target.closest('[data-st-reply]')) {
      const inp = document.getElementById('stReply');

      if (!txt) return;
      App.sendStatusReply(s.id, txt);
      return;
    }

      if (e.target.closest('video')) return;
      const x = e.clientX;
      if (x < window.innerWidth * 0.32) App.statusStep(-1);
      else App.statusStep(1);
    }
  });
  root.addEventListener('contextmenu', (e) => e.preventDefault());
  // record viewer
  if (!mine) {
    s.viewers = s.viewers || [];
    if (!s.viewers.includes(me().id)) s.viewers.push(me().id);
    persist(true);
  }
  Media.hydrate(root);
  clearTimeout(v.timer);
  v.timer = setTimeout(() => App.statusStep(1), s.type === 'video' ? 16000 : 5200);
}
App.statusStep = function (dir) {
  const v = STATUS_VIEW; if (!v) return;
  clearTimeout(v.timer);
  const nx = v.idx + dir;
  if (nx < 0) { v.idx = 0; renderStatusViewer(); return; }
  if (nx >= v.items.length) {
    const u = me();
    const others = [...new Set(DB.statuses.filter(s => s.userId !== u.id && s.createdAt + 86400000 > Date.now()).map(s => s.userId))];
    const nextUser = others.find(id => id !== v.userId);
    if (nextUser) { closeViewer(); return App.openStatus(nextUser); }
    return closeViewer();
  }
  v.idx = nx; renderStatusViewer();
};
App.statusViewers = function (id) {
  const s = DB.statuses.find(x => x.id === id); if (!s) return;
  const viewers = (s.viewers || []).map(findUser).filter(Boolean);
  openModal(modalShell('Status viewers', viewers.length ? `<div class="list">${viewers.map(v => `<div class="list-item">${avatarHTML(v, 'sm')}
    <div class="grow"><div class="small" style="font-weight:600">${esc(v.fullName)}</div><div class="tiny muted">@${esc(v.username)}</div></div></div>`).join('')}</div>`
    : `<div class="empty" style="padding:16px"><p>No views yet. Only contacts who can see this status appear here.</p></div>`,
    `<button class="btn btn-ghost" data-close style="width:100%">Close</button>`, (s.viewers || []).length + ' views'));
};
App.deleteStatus = async function (id) {

  DB.statuses = DB.statuses.filter(s => s.id !== id);

App.sendStatusReply = function (statusId, text) {
  const s = DB.statuses.find(x => x.id === statusId);
  if (!s) return;
  const u = me();
  if (!isContact(u.id, s.userId) && s.userId !== u.id) DB.contacts.push({ id: uid('ct'), ownerId: u.id, userId: s.userId, createdAt: Date.now() });
  const cid = chatId(u.id, s.userId);
  DB.messages.push({
    id: uid('msg'), chatId: cid, from: u.id, to: s.userId, type: 'text', text,
    replyText: s.type === 'text' ? s.text : 'Status', createdAt: Date.now(), status: 'sent', forwarded: false, deleted: false
  });
  notify(s.userId, 'New reply to your status', u.fullName + ': ' + text.slice(0, 100), '#/chat/' + u.id, 'chat');
  sync(); closeViewer(); toast('Reply sent', 'ok'); go('chat/' + s.userId);
};

App.openSearch = function (q) {

  const people = DB.users.filter(x => x.id !== u.id && !x.banned && (x.username.toLowerCase().includes(ql) || x.fullName.toLowerCase().includes(ql) || x.email.toLowerCase() === ql))
    .slice(0, 6);
  const prods = DB.products.filter(p => p.active && p.stock > 0 && (p.name.toLowerCase().includes(ql) || p.category.toLowerCase().includes(ql))).slice(0, 6);
  const chats = myContacts(u.id).filter(c => c.fullName.toLowerCase().includes(ql) || c.username.toLowerCase().includes(ql)).slice(0, 5);
  openModal(modalShell('Search results', `
    ${chats.length ? `<div class="label mb10">Chats</div><div class="list" style="margin-bottom:14px">${chats.map(c => `<button class="list-item" data-act="open-chat" data-id="${c.id}" style="width:100%;text-align:left">${avatarHTML(c, 'sm')}<span class="grow"><span class="small" style="font-weight:600">${esc(c.fullName)}</span><span class="tiny muted" style="display:block">@${esc(c.username)}</span></span>${ic('chat', 15)}</button>`).join('')}</div>` : ''}
    ${people.length ? `<div class="label mb10">People</div><div class="list" style="margin-bottom:14px">${people.map(x => `<button class="list-item" data-act="view-profile" data-id="${x.id}" style="width:100%;text-align:left">${avatarHTML(x, 'sm')}<span class="grow"><span class="small" style="font-weight:600">${esc(x.fullName)}</span><span class="tiny muted" style="display:block">@${esc(x.username)}</span></span>${isContact(u.id, x.id) ? '<span class="badge">Contact</span>' : `<span class="badge badge-accent">Add</span>`}</button>`).join('')}</div>` : ''}
    ${prods.length ? `<div class="label mb10">Products</div><div class="list">${prods.map(p => `<button class="list-item" data-act="open-product" data-id="${p.id}" style="width:100%;text-align:left">${ic('bag', 16)}<span class="grow"><span class="small" style="font-weight:600">${esc(p.name)}</span><span class="tiny muted" style="display:block">${coins(p.priceUsd / COIN_USD)} WC · ${usd(p.priceUsd)}</span></span>${ic('chevron', 15)}</button>`).join('')}</div>` : ''}
    ${!people.length && !prods.length && !chats.length ? `<div class="empty" style="padding:20px"><p>No results for “${esc(q)}”.</p></div>` : ''}`,
    `<button class="btn btn-ghost" data-close style="width:100%">Close</button>`, 'Searching WhaleChat'));
};


/* ---------------- message & status reactions ---------------- */
App.reactMsg = function (id, ds) {
  const m = DB.messages.find(x => x.id === id);
  if (!m || !ds || !ds.emoji) return;
  const u = me(); if (!u) return;
  m.reactions = m.reactions || {};
  if (m.reactions[u.id] === ds.emoji) delete m.reactions[u.id];
  else m.reactions[u.id] = ds.emoji;
  if (!Object.keys(m.reactions).length) delete m.reactions;
  sync();
  closeModal();
  render();
  setTimeout(() => { const b = document.getElementById('chatBody'); if (b) b.scrollTop = b.scrollHeight; }, 30);
};

App.reactStatus = function (id, ds) {
  const s = DB.statuses.find(x => x.id === id);
  if (!s || !ds || !ds.emoji) return;
  const u = me(); if (!u) return;
  s.reactions = s.reactions || {};
  if (s.reactions[u.id] === ds.emoji) delete s.reactions[u.id];
  else s.reactions[u.id] = ds.emoji;
  if (!Object.keys(s.reactions).length) delete s.reactions;
  sync();
  renderStatusViewer();
};

function productCard(p, u) {
  const v = vendorById(p.vendorId);
  const vUser = v ? findUser(v.userId) : null;
  const starred = (p.starUsers || []).includes(u.id);
  const inCart = (u.cart || []).some(c => c.productId === p.id);
  return `<div class="product-card">
    <a href="#/product/${p.id}" style="display:block;position:relative">
      ${productThumb(p, 150)}
      ${p.stock <= 3 ? `<span class="badge badge-warn" style="position:absolute;top:8px;right:8px">Only ${p.stock} left</span>` : ''}
    </a>
    <div class="product-body">
      <a href="#/product/${p.id}" class="product-name">${esc(p.name)}</a>
      <div class="stars-row">${vUser ? `<span class="ellipsis" style="max-width:86px">${esc(vUser.username)}</span><span style="opacity:.5">·</span>` : ''}
        <span style="color:var(--gold)">★</span> ${(v ? v.rating : 5).toFixed(1)} <span style="opacity:.5">·</span> ${v ? `Trust ${v.trustScore}` : ''}</div>
      <div class="between mt6" style="align-items:flex-end">
        <div><div class="price">${coins(p.priceUsd / COIN_USD)} <span class="tiny muted">WC</span></div><div class="tiny muted">${usd(p.priceUsd)}</div></div>
        <div class="col" style="align-items:flex-end;gap:4px">
          <button class="star-btn ${starred ? 'on' : ''}" data-act="star-product" data-id="${p.id}">${ic('star', 12)} ${(p.starUsers || []).length}</button>
        </div>
      </div>
      <button class="btn ${inCart ? 'btn-soft' : 'btn-primary'} btn-sm mt6" style="width:100%" data-act="add-cart" data-id="${p.id}">
        ${ic(inCart ? 'check' : 'cart', 14)} ${inCart ? 'In cart' : 'Add to cart'}</button>
    </div>
  </div>`;
}

AFTER.market = function () {
  const ms = document.getElementById('marketSearch');

App.addToCart = function (id, qty) {
  const u = me(); const p = DB.products.find(x => x.id === id);
  if (!p) return;
  if (!p.active || p.stock < 1) return toast('This product is sold out', 'err');
  u.cart = u.cart || [];
  const line = u.cart.find(c => c.productId === id);
  const want = Math.max(1, qty || 1);
  if (line) {
    if (line.qty + want > p.stock) return toast('Only ' + p.stock + ' available', 'err');
    line.qty += want;
  } else u.cart.push({ productId: id, qty: want });
  sync(); toast('Added to cart', 'ok'); render();
};

App.placeOrder = async function () {
  const u = me();
  clearErrors();
  const fullName = document.getElementById('ckName').value.trim();
  const phone = document.getElementById('ckPhone').value.trim();
  const email = document.getElementById('ckEmail').value.trim();
  const country = document.getElementById('ckCountry').value.trim();
  const address = document.getElementById('ckAddress').value.trim();
  const conf = document.getElementById('ckConfirm').checked;
  if (fullName.length < 3) return formError('ckName', 'Enter the receiver full name');
  if (phone.replace(/\D/g, '').length < 7) return formError('ckPhone', 'Enter a valid phone number');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return formError('ckEmail', 'Enter a valid email');
  if (country.length < 2) return formError('ckCountry', 'Enter your country');
  if (address.length < 8) return formError('ckAddress', 'Enter your full house address');
  if (!conf) return toast('Please confirm your delivery details', 'err');

  const items = (u.cart || []).map(c => ({ ...c, p: DB.products.find(p => p.id === c.productId) })).filter(x => x.p);
  if (!items.length) return toast('Cart is empty', 'err');
  const totalUsd = items.reduce((s, x) => s + x.p.priceUsd * x.qty, 0);
  const totalCoins = Math.round(totalUsd / COIN_USD * 100) / 100;
  if (u.balance < totalCoins) return toast('Insufficient balance — deposit Whale Coin first', 'err');

  // vendor availability + stock check
  for (const it of items) {
    const vd = vendorById(it.p.vendorId);
    if (!vendorIsActive(vd)) return toast(`${it.p.name}: the vendor store is temporarily unavailable`, 'err');
    if (it.qty > it.p.stock) return toast(`Only ${it.p.stock} of ${it.p.name} left`, 'err');
  }

  // group by vendor
  const groups = {};
  items.forEach(it => { const k = it.p.vendorId; (groups[k] = groups[k] || []).push(it); });
  const created = [];
  Object.keys(groups).forEach(vid => {
    const v = vendorById(vid);
    if (!v) return;
    const gItems = groups[vid];
    const gUsd = gItems.reduce((s, x) => s + x.p.priceUsd * x.qty, 0);
    const gCoins = Math.round(gUsd / COIN_USD * 100) / 100;
    const off = delivery(fullName, phone, email, country, address);
    const order = {
      id: uid('ord'), ref: 'WC-' + Math.random().toString(36).slice(2, 7).toUpperCase(),
      buyerId: u.id, vendorId: vid,
      items: gItems.map(x => ({ productId: x.p.id, name: x.p.name, qty: x.qty, priceUsd: x.p.priceUsd, image: x.p.image, emoji: x.p.emoji, category: x.p.category })),
      totalUsd: Math.round(gUsd * 100) / 100, totalCoins: gCoins,
      delivery: off, status: 'processing', createdAt: Date.now(), payment: 'whale_coin',
      timeline: [{ status: 'processing', at: Date.now(), note: 'Order placed and awaiting team review.' }]
    };
    DB.orders.unshift(order);
    created.push(order);
    // stock + vendor credit
    gItems.forEach(x => {
      x.p.stock = Math.max(0, x.p.stock - x.qty);
      if (x.p.stock === 0) x.p.active = false;
    });
    const vu = findUser(v.userId);
    if (vu) {
      vu.balance = Math.round((vu.balance + gCoins) * 100) / 100;
      vu.totalEarnings = Math.round(((vu.totalEarnings || 0) + gCoins) * 100) / 100;
      v.sales = (v.sales || 0) + 1;
      v.revenue = Math.round(((v.revenue || 0) + gUsd) * 100) / 100;
      tx(vu.id, 'sale', 'Sale · ' + order.ref, gCoins);
      notify(vu.id, 'Your product was purchased 🎉', `${gItems[0].name}${gItems.length > 1 ? ' +' + (gItems.length - 1) + ' more' : ''} · ${coins(gCoins)} WC credited to your balance.`, '#/vendor/orders', 'bag');
    }
    notify('usr_admin', 'New order · ' + order.ref, `${items.length} item(s) from ${esc(v.username)} — delivery details attached.`, '#/admin/orders', 'truck');
  });

  u.balance = Math.round((u.balance - totalCoins) * 100) / 100;
  u.cart = [];
  tx(u.id, 'purchase', 'Order ' + (created[0] ? created[0].ref : ''), -totalCoins);
  notify(u.id, 'Request processing', 'Your request is being processed. Please wait for our team to proceed. You can track your package movements anytime.', '#/orders', 'truck');
  sync();
  const total = created.reduce((s, o) => s + o.totalCoins, 0);
  openModal(modalShell('Request processing', `
    <div class="center" style="padding:6px 0 4px">
      <div style="width:64px;height:64px;border-radius:50%;background:rgba(46,230,201,.14);color:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto">${ic('check', 30)}</div>
      <h3 class="mt16" style="font-size:18px">Your request is being processed</h3>
      <p class="small muted mt10" style="line-height:1.7">Please wait for our team to proceed. We've reserved ${coins(total)} WC from your wallet and notified the vendor.</p>
      <div class="panel mt16" style="padding:12px;text-align:left">
        ${created.map(o => `<div class="between" style="padding:5px 0"><span class="tiny muted">${esc(o.ref)}</span><span class="small" style="font-weight:600">${coins(o.totalCoins)} WC</span></div>`).join('')}
      </div>
    </div>`,
    `<button class="btn btn-ghost" data-close style="flex:1">Keep shopping</button>
     <a href="#/orders" class="btn btn-primary" data-close style="flex:1">${ic('truck', 15)} Track package</a>`), { locked: false, width: '430px' });
  setTimeout(() => { if (me()) render(); }, 100);
};
function delivery(fullName, phone, email, country, address) {
  return { fullName, phone, email, country, address };
}

  const steps = ['processing', 'shipped', 'delivered'];

App.applyVendor = async function () {
  const u = me(); clearErrors();
  const name = document.getElementById('vName').value.trim();
  const p1 = document.getElementById('vPass').value, p2 = document.getElementById('vPass2').value;
  if (!/^[a-zA-Z0-9._-]{3,24}$/.test(name)) return formError('vName', '3–24 characters: letters, numbers, dot, dash or underscore');
  if (DB.vendors.some(v => v.username.toLowerCase() === name.toLowerCase())) return formError('vName', 'That vendor username is taken');
  if ((DB.vendorApplications || []).some(a => a.status === 'pending' && a.vendorUsername.toLowerCase() === name.toLowerCase() && a.userId !== u.id)) return formError('vName', 'That vendor username is under review by another applicant');
  if (!p1) return formError('vPass', 'Confirm your account password');
  if (await hash(p1) !== u.pass) return formError('vPass', 'That password does not match your account');
  if (p1 !== p2) return formError('vPass2', 'Passwords do not match');
  const methodEl = document.querySelector('input[name="vpm"]:checked');
  const methods = vendorPayMethods();
  const method = methodEl ? methods.find(m => m.id === methodEl.value) : methods[0];
  if (!method) return toast('No vendor payment account is configured — contact support', 'err');
  if (!VENDOR_SLIP) return toast('Upload your payment slip / receipt', 'err');
  if (!document.getElementById('vAgree').checked) return toast('Please confirm the fee was paid and accept the terms', 'err');
  const planEl = document.querySelector('input[name="vplan"]:checked');
  const plan = planEl ? vendorPlanById(planEl.value) : (DB.settings.vendorPlans || [])[0];
  if (!plan) return toast('No vendor duration is configured — contact support', 'err');
  const fee = Math.max(0, Number(plan.priceUsd) || 0);

  DB.vendorApplications = DB.vendorApplications || [];
  const app = {
    id: uid('vap'), kind: 'new', userId: u.id, userName: u.fullName, username: u.username,
    vendorUsername: name, feeUsd: fee, planId: plan.id, months: plan.months,
    methodId: method.id, methodLabel: method.label + (method.network ? ' · ' + method.network : ''),
    address: method.address, proof: VENDOR_SLIP, status: 'pending', note: '', createdAt: Date.now()
  };
  DB.vendorApplications.unshift(app);
  notify('usr_admin', 'Vendor application · ' + usd(fee), `${u.fullName} (@${u.username}) applied as @${name} and uploaded a payment slip.`, '#/admin/vendor-requests', 'store');
  notify(u.id, 'Vendor application submitted', 'Your payment slip is under review. You will be notified once approved.', '#/vendor', 'clock');
  VENDOR_SLIP = null;
  sync();
  toast('Application submitted — awaiting admin approval', 'ok', 3600);
  render();
};

  if (await hash(p1) !== u.pass) return formError('vPass', 'That password does not match your account');
  if (p1 !== p2) return formError('vPass2', 'Passwords do not match');
  if (!document.getElementById('vAgree').checked) return toast('Please accept the Vendor Terms', 'err');
  const v = {
    id: uid('vnd'), userId: u.id, username: name, name: name, avatar: u.avatar,
    rating: 5, trustScore: 80, sales: 0, revenue: 0, createdAt: Date.now(), status: 'active', completedSales: 0,
    planMonths: 1, planId: (DB.settings.vendorPlans || [])[0] ? DB.settings.vendorPlans[0].id : null,
    expiresAt: Date.now() + 30 * 86400000
  };
  DB.vendors.push(v);
  u.vendorId = v.id;
  notify('usr_admin', 'New vendor profile', `${u.fullName} opened a store as @${name}.`, '#/admin/vendors', 'store');

};

App.applyVendorRenew = async function () {
  const u = me(); const v = vendorOf(u.id);
  if (!v) return;
  const planEl = document.querySelector('input[name="vplan"]:checked');
  const plan = planEl ? vendorPlanById(planEl.value) : (DB.settings.vendorPlans || [])[0];
  if (!plan) return toast('Choose a renewal duration', 'err');
  const methodEl = document.querySelector('input[name="vpm"]:checked');
  const methods = vendorPayMethods();
  const method = methodEl ? methods.find(m => m.id === methodEl.value) : methods[0];
  if (!method) return toast('No vendor payment account configured', 'err');
  if (!VENDOR_SLIP) return toast('Upload your payment slip / receipt', 'err');
  DB.vendorApplications = DB.vendorApplications || [];
  DB.vendorApplications.unshift({
    id: uid('vap'), kind: 'renewal', userId: u.id, vendorId: v.id,
    userName: u.fullName, username: u.username, vendorUsername: v.username,
    feeUsd: Number(plan.priceUsd) || 0, planId: plan.id, months: plan.months,
    methodId: method.id, methodLabel: method.label + (method.network ? ' · ' + method.network : ''),
    address: method.address, proof: VENDOR_SLIP, status: 'pending', note: '', createdAt: Date.now()
  });
  notify('usr_admin', 'Vendor renewal · @' + v.username, `${u.fullName} paid ${usd(plan.priceUsd)} for ${plan.months} month${plan.months > 1 ? 's' : ''} and uploaded a slip.`, '#/admin/vendor-requests', 'clock');
  notify(u.id, 'Renewal submitted', 'Your payment slip is under review. Access resumes once approved.', '#/vendor', 'clock');
  VENDOR_SLIP = null;
  sync(); toast('Renewal submitted for approval', 'ok'); render();
};

App.buyCompany = function (id) {

App.confirmCompany = function (id) {
  const u = me(); const p = DB.companyProducts.find(x => x.id === id);
  const v = vendorOf(u.id);
  if (!p || !v) return;
  const q = Math.max(1, Math.min(p.stock, Number(document.getElementById('bq').value) || 1));
  const totalUsd = p.priceUsd * q;
  const totalCoins = Math.round(totalUsd / COIN_USD * 100) / 100;
  if (u.balance < totalCoins) return toast('Insufficient balance — deposit Whale Coins first', 'err');
  u.balance = Math.round((u.balance - totalCoins) * 100) / 100;
  p.stock -= q;
  const existing = DB.products.find(x => x.vendorId === v.id && x.companyProductId === p.id && !x.active);
  let inventory;
  if (existing) { existing.stock += q; inventory = existing; }
  else {
    inventory = {
      id: uid('prd'), vendorId: v.id, companyProductId: p.id, name: p.name, category: p.category,
      priceUsd: null, costUsd: p.priceUsd, stock: q, image: p.image, emoji: p.emoji,
      description: p.description, active: false, starUsers: [], stars: 0, createdAt: Date.now()
    };
    DB.products.push(inventory);
  }
  DB.purchases = DB.purchases || [];
  DB.purchases.unshift({
    id: uid('buy'), vendorId: v.id, productId: p.id, companyProductId: p.id,
    inventoryId: inventory.id, name: p.name, qty: q, totalUsd, totalCoins,
    status: 'active', createdAt: Date.now()
  });
  tx(u.id, 'stock', 'Company stock · ' + p.name + ' ×' + q, -totalCoins);
  notify('usr_admin', 'Vendor stock purchase', `@${v.username} bought ${q} × ${p.name} (${coins(totalCoins)} WC).`, '#/admin/products', 'box');
  notify(u.id, 'Stock added to inventory', `${q} × ${p.name} is ready. Set a selling price to publish it.`, '#/vendor/products', 'tag');
  sync(); closeModal(); toast('Stock purchased — set a selling price', 'ok'); go('vendor/products');
};

App.saveListing = function (id) {
  const u = me(); const p = DB.products.find(x => x.id === id);
  if (!p) return;
  const usdVal = Math.round(Number(document.getElementById('sellUsd').value) * 100) / 100;
  const qty = Math.max(0, Math.min(p.stock, Number(document.getElementById('sellQty').value) || 0));
  if (!(usdVal > 0)) return toast('Enter a selling price', 'err');
  p.priceUsd = usdVal;
  if (qty < p.stock) {
    // keep the unlisted remainder as a separate hidden inventory record
    DB.products.push({
      id: uid('prd'), vendorId: p.vendorId, companyProductId: p.companyProductId,
      name: p.name, category: p.category, priceUsd: null, costUsd: p.costUsd,
      stock: p.stock - qty, image: p.image, emoji: p.emoji, description: p.description,
      active: false, starUsers: [], stars: 0, createdAt: Date.now()
    });
  }
  p.stock = qty;
  p.active = qty > 0;
  sync(); closeModal();
  toast(p.active ? 'Listed on the public marketplace' : 'Listing saved (hidden — no stock)', 'ok');
  render();
};

App.requestRefund = function (purchaseId) {
  const u = me(); const v = vendorOf(u.id);
  const b = (DB.purchases || []).find(x => x.id === purchaseId && x.vendorId === (v && v.id));
  if (!b) return toast('Purchase not found', 'err');
  if (b.status === 'refunded') return toast('This purchase is already refunded', 'err');
  const pending = (DB.refunds || []).find(r => r.purchaseId === b.id && r.status === 'pending');
  if (pending) return toast('A refund request is already pending', 'err');
  const inv = DB.products.find(x => x.id === b.inventoryId);
  if (!inv || inv.stock < b.qty) return toast('Some units were already sold or listed — refund unavailable', 'err');
  openModal(modalShell('Return & refund · ' + b.name, `
    <div class="row gap12 mb16">
      <div style="width:56px;height:56px;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:24px">${inv.emoji || '📦'}</div>
      <div><div class="small" style="font-weight:650">${esc(b.name)} × ${b.qty}</div>
        <div class="tiny muted mt6">Paid ${coins(b.totalCoins)} WC · ${usd(b.totalUsd)}</div></div>
    </div>
    <div class="panel" style="padding:12px;margin-bottom:14px">
      <div class="tiny" style="font-weight:600;color:var(--accent)">How refunds work</div>
      <div class="tiny muted mt6" style="line-height:1.7">The admin reviews your request. If approved, the unsold units return to the company stock and the full amount is credited back to your Whale Coin balance.</div>
    </div>
    <div class="field"><label class="label">Reason (optional)</label>
      <textarea class="input" id="refundReason" style="min-height:80px" placeholder="Why are you returning this stock?"></textarea></div>`,
    `<button class="btn btn-ghost" data-close>Cancel</button>
     <button class="btn btn-primary" data-act="submit-refund" data-id="${b.id}">${ic('refresh', 15)} Request refund</button>`), { width: '460px' });
};
App.submitRefund = function (purchaseId) {
  const u = me(); const v = vendorOf(u.id);
  const b = (DB.purchases || []).find(x => x.id === purchaseId && x.vendorId === (v && v.id));
  if (!b) return;
  const reason = (document.getElementById('refundReason') || {}).value || '';
  const inv = DB.products.find(x => x.id === b.inventoryId);
  if (!inv || inv.stock < b.qty) return toast('Stock already sold — refund unavailable', 'err');
  DB.refunds = DB.refunds || [];
  DB.refunds.unshift({
    id: uid('rfd'), purchaseId: b.id, vendorId: v.id, companyProductId: b.companyProductId,
    inventoryId: b.inventoryId, name: b.name, qty: b.qty, coins: b.totalCoins, usd: b.totalUsd,
    reason: String(reason).slice(0, 400), status: 'pending', createdAt: Date.now()
  });
  notify('usr_admin', 'Refund request', `@${v.username} requested a refund for ${b.qty} × ${b.name} (${coins(b.totalCoins)} WC).`, '#/admin/refunds', 'refresh');
  notify(u.id, 'Refund requested', 'Your request is pending admin review.', '#/vendor/history', 'refresh');
  sync(); closeModal(); toast('Refund request submitted', 'ok'); render();
};
App.cancelRefund = async function (refundId) {
  const r = (DB.refunds || []).find(x => x.id === refundId);
  if (!r) return;
  if (!await confirmDialog({ title: 'Cancel refund request?', body: 'You can submit a new request later.', danger: true, ok: 'Cancel request' })) return;
  DB.refunds = DB.refunds.filter(x => x.id !== refundId);
  sync(); toast('Refund request cancelled', 'ok'); render();
};

App.submitDeposit = function (mode) {
  const u = me(); clearErrors();
  const usdAmt = Math.round(Number(document.getElementById('depUsd').value) * 100) / 100;
  if (!(usdAmt >= 1)) return formError('depUsd', 'Enter at least $1');
  let methodName = '', detail = '';
  if (mode === 'crypto') {
    const sel = document.querySelector('input[name="depm"]:checked');
    if (!sel) return toast('Select a crypto payment method', 'err');
    const m = (DB.settings.crypto || []).find(x => x.id === sel.value);
    methodName = m ? m.name : 'Crypto';
    detail = m ? m.address : '';
  } else {
    methodName = 'Bank transfer';
    detail = (document.getElementById('depRef') || {}).value || '';
    if (!(DB.settings.banks || []).length) return toast('No bank details configured', 'err');
  }
  DB.deposits.unshift({
    id: uid('dep'), userId: u.id, usd: usdAmt, coins: usdToCoins(usdAmt),
    method: mode, methodName, detail, status: 'pending', createdAt: Date.now(), note: ''
  });
  notify('usr_admin', 'New deposit request', `${u.fullName} (@${u.username}) submitted ${usd(usdAmt)} via ${methodName}.`, '#/admin/deposits', 'wallet');
  notify(u.id, 'Deposit submitted', `Your ${usd(usdAmt)} deposit is pending review. You'll be credited ${coins(usdToCoins(usdAmt))} WC once approved.`, '#/wallet', 'wallet');

App.submitWithdraw = async function () {
  const u = me(); clearErrors();
  const net = document.getElementById('wdNet').value;
  const addr = document.getElementById('wdAddr').value.trim();
  const amt = Math.round((Number(document.getElementById('wdCoins').value) || 0) * 100) / 100;
  const pin = document.getElementById('wdPin').value;
  if (!addr || addr.length < 12) return formError('wdAddr', 'Enter a valid USDT wallet address');
  if (!(amt >= 5)) return formError('wdCoins', 'Minimum withdrawal is 5 WC');
  if (amt > u.balance) return formError('wdCoins', 'Amount exceeds your available balance');
  if (!/^\d{4,6}$/.test(pin)) return formError('wdPin', 'Enter your 4–6 digit PIN');
  if (!document.getElementById('wdConfirm').checked) return toast('Please confirm the wallet address', 'err');
  if (await hash('pin::' + pin) !== u.pin) return formError('wdPin', 'Incorrect PIN');
  u.balance = Math.round((u.balance - amt) * 100) / 100;
  const wdId = uid('wd');
  const activity = tx(u.id, 'withdrawal', 'Withdrawal request · ' + net, -amt, { withdrawalId: wdId });
  DB.withdrawals.unshift({
    id: wdId, userId: u.id, network: net, address: addr, coins: amt,
    usd: coinsToUsd(amt), status: 'pending', createdAt: Date.now(), note: '',
    txId: activity.id
  });
  notify('usr_admin', 'New withdrawal request', `${u.fullName} requested ${coins(amt)} WC (${usd(coinsToUsd(amt))}) via ${net}.`, '#/admin/withdrawals', 'download');
  notify(u.id, 'Withdrawal submitted', `Your request for ${coins(amt)} WC is pending review.`, '#/wallet', 'download');
  sync();
  openModal(modalShell('Withdrawal requested', `
    <div class="center"><div style="width:58px;height:58px;border-radius:50%;background:rgba(46,230,201,.14);color:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto">${ic('check', 26)}</div>

  setTimeout(() => render(), 60);
};

App.avatarMenu = function () {
  const u = me();
  openModal(modalShell('Profile photo', `
    <div class="center">${avatarHTML(u, 'xl')}</div>
    <div class="list mt16">
      <button class="list-item" data-act="avatar-upload" style="width:100%;text-align:left">${ic('image', 17)} <span class="grow">Upload from gallery</span></button>
      <button class="list-item" data-act="avatar-camera" style="width:100%;text-align:left">${ic('camera', 17)} <span class="grow">Take a photo</span></button>
      ${u.avatar ? `<button class="list-item" data-act="avatar-remove" style="width:100%;text-align:left;color:var(--danger)">${ic('trash', 17)} <span class="grow">Remove photo</span></button>` : ''}
    </div>`, `<button class="btn btn-ghost" data-close style="width:100%">Close</button>`));
};
App.avatarUpload = async function (camera) {
  closeModal();
  const f = await pickFile({ accept: 'image/*', capture: camera });
  if (!f) return;
  const c = await compressImage(f, 512, 0.8);
  const data = await fileToDataURL(c);
  const u = me();
  u.avatar = data;
  if (u.vendorId) { const v = vendorById(u.vendorId); if (v) v.avatar = data; }
  sync(); toast('Profile photo updated', 'ok'); render();
};
App.avatarRemove = async function () {
  const u = me();
  if (!await confirmDialog({ title: 'Remove photo?', body: 'Your default avatar will be shown instead.', danger: true, ok: 'Remove' })) return;
  u.avatar = null; closeModal(); sync(); toast('Photo removed', 'ok'); render();
};
function fileToDataURL(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
}

App.editProfile = function () {
  const u = me();
  openModal(modalShell('Edit profile', `
    ${field('Full name', 'epName', { value: u.fullName })}
    ${field('Username', 'epUser', { value: u.username, help: 'Your unique @handle.' })}
    ${field('Email', 'epEmail', { type: 'email', value: u.email })}
    ${field('Phone', 'epPhone', { value: u.phone || '' })}
    ${field('Bio / status text', 'epBio', { value: u.bio || '', ph: 'A short line about you' })}`,
    `<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" data-act="save-profile">Save changes</button>`));
};
App.saveProfile = async function () {
  const u = me(); clearErrors();
  const fullName = document.getElementById('epName').value.trim();
  const username = document.getElementById('epUser').value.trim();
  const email = document.getElementById('epEmail').value.trim();
  const phone = document.getElementById('epPhone').value.trim();
  if (fullName.length < 3) return formError('epName', 'Enter your full name');
  if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) return formError('epUser', '3–20 characters: letters, numbers, underscores');
  if (DB.users.some(x => x.id !== u.id && x.username.toLowerCase() === username.toLowerCase())) return formError('epUser', 'Username already taken');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return formError('epEmail', 'Enter a valid email');
  if (DB.users.some(x => x.id !== u.id && x.email.toLowerCase() === email.toLowerCase())) return formError('epEmail', 'Email already in use');
  u.fullName = fullName; u.username = username; u.email = email; u.phone = phone; u.bio = document.getElementById('epBio').value.trim();
  sync(); closeModal(); toast('Profile saved', 'ok'); render();
};

App.savePassword = async function () {
  const u = me(); clearErrors();
  const oldp = document.getElementById('cpOld').value;
  const n1 = document.getElementById('cpNew').value, n2 = document.getElementById('cpNew2').value;
  if (await hash(oldp) !== u.pass) return formError('cpOld', 'Current password is incorrect');
  if (n1.length < 6) return formError('cpNew', 'At least 6 characters');

  u.pass = await hash(n1);
  sync(); closeModal(); toast('Password updated', 'ok');
};
App.changePin = async function () {
  const u = me();
  if (u.pin) {
    const old = await askPin({ title: 'Current PIN', sub: 'Confirm your existing withdrawal PIN' });
    if (!old) return;
    if (await hash('pin::' + old) !== u.pin) return toast('Incorrect PIN', 'err');
  }
  const np = await askPin({ title: 'New withdrawal PIN', sub: 'Choose 4–6 digits', confirm: true });
  if (!np) return;
  u.pin = await hash('pin::' + np);
  sync(); toast('Withdrawal PIN updated', 'ok'); render();
};

let ADMIN_MAINT_TIMER = null;
AFTER.admin = function (parts) {
  const sub = parts[1] || '';
  clearInterval(ADMIN_MAINT_TIMER);
  if (sub === 'settings') {
    ADMIN_MAINT_TIMER = setInterval(() => {
      const el = document.getElementById('adminMaintRemaining');
      if (!el) { clearInterval(ADMIN_MAINT_TIMER); return; }
      const mi = maintenanceInfo();
      if (!mi.active) { clearInterval(ADMIN_MAINT_TIMER); render(); return; }
      const c = fmtCountdown(mi.until - Date.now());
      el.textContent = (c.d ? c.d + 'd ' : '') + c.h + ':' + c.m + ':' + c.s;
    }, 1000);
  }
  if (sub === 'products') bindProductForm();
  if (sub === 'users') {
    const s = document.getElementById('adminUserSearch');
    if (s) s.oninput = () => { ADMIN_USER_Q = s.value.toLowerCase(); render(); const n = document.getElementById('adminUserSearch'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } };
  }
  if (sub === 'settings') bindSettings();
  if (sub === 'release') loadReleasePanel();
};

async function loadReleasePanel() {
  const set = (id, txt) => { const el = document.getElementById(id); if (el) el.textContent = txt; };
  try {
    const r = await fetch('/api/release?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('no-server');
    const d = await r.json();
    const same = d.build && d.build === APP_BUILD;
    set('relServerBuild', d.build ? d.build.replace('T', ' ').replace('Z', '') : 'unknown');
    set('relServerBuildRow', d.build || 'unknown');
    set('relUptime', Math.floor((d.uptimeSec || 0) / 3600) + 'h ' + Math.floor(((d.uptimeSec || 0) % 3600) / 60) + 'm');
    set('relClients', String(d.clients || 0));
    set('relRev', String(d.rev || 0));
    set('relDevices', String(d.devices || 0));
    const badge = document.getElementById('relBadge');
    if (badge) {
      badge.className = 'badge ' + (same ? 'badge-success' : 'badge-warn');
      badge.textContent = same ? 'Up to date' : 'Update available';
    }
    try {
      const bk = await fetch('/api/backup', { cache: 'no-store' }).then(x => x.json());
      const du = document.getElementById('relDataUsers'); if (du) du.textContent = String(bk.users || 0);
      const db = document.getElementById('relDataBackups'); if (db) db.textContent = (bk.count || 0) + ' snapshot' + ((bk.count || 0) === 1 ? '' : 's');
      const dl = document.getElementById('relDataLast'); if (dl) dl.textContent = bk.last ? new Date(bk.last).toLocaleString() : 'none yet';
      const ds = document.getElementById('relDataStore'); if (ds) ds.textContent = bk.persistent ? 'Persistent disk' : (bk.recoverable ? 'Ephemeral storage + persistent backups' : 'Ephemeral — set DATA_DIR to a disk');
      const dgb = document.getElementById('relDataBadge');
      if (dgb) {
        if (bk.persistent) { dgb.className = 'badge badge-success'; dgb.textContent = 'Protected'; }
        else if (bk.recoverable) { dgb.className = 'badge badge-success'; dgb.textContent = 'Protected via backups'; }
        else { dgb.className = 'badge badge-danger'; dgb.textContent = 'At risk'; }
      }
    } catch (e2) {}
  } catch (e) {
    set('relServerBuild', 'local mode');
    set('relServerBuildRow', 'unavailable');
    set('relRev', '—'); set('relDevices', '—'); set('relUptime', '—'); set('relClients', '—');
    const badge = document.getElementById('relBadge');
    if (badge) { badge.className = 'badge badge-warn'; badge.textContent = 'No sync server'; }
  }
}

App.adminSaveUser = function (id) {
  const x = findUser(id); if (!x) return;
  const bal = Number(document.getElementById('auBal').value);
  const trust = Number(document.getElementById('auTrust').value);
  const sales = Number(document.getElementById('auSales').value);
  const earn = Number(document.getElementById('auEarn').value);
  if (isNaN(bal) || bal < 0) return toast('Invalid balance', 'err');
  const diff = Math.round((bal - x.balance) * 100) / 100;
  x.balance = Math.round(bal * 100) / 100;
  x.trustScore = Math.max(0, Math.min(100, trust || 0));
  x.completedSales = Math.max(0, sales || 0);
  x.totalEarnings = Math.round((earn || 0) * 100) / 100;
  if (diff) tx(x.id, diff > 0 ? 'deposit' : 'withdrawal', 'Admin balance adjustment', diff);
  notify(x.id, 'Account updated', 'Your account settings were updated by the WhaleChat team.', '#/profile', 'settings');
  sync(); closeModal(); toast('User updated', 'ok'); render();
};
App.adminCredit = async function (id) {
  const v = await promptDialog({ title: 'Add Whale Coin', label: 'Amount in WC (negative to deduct)', type: 'number', placeholder: '10' });
  if (!v) return;
  const amt = Number(v);
  if (!isFinite(amt) || amt === 0) return toast('Enter a valid amount', 'err');
  const x = findUser(id); if (!x) return;
  x.balance = Math.round((x.balance + amt) * 100) / 100;
  tx(x.id, amt > 0 ? 'deposit' : 'withdrawal', 'Admin credit', amt);
  notify(x.id, amt > 0 ? 'Wallet credited' : 'Wallet adjusted', `${coins(Math.abs(amt))} WC ${amt > 0 ? 'added to' : 'deducted from'} your balance by the WhaleChat team.`, '#/wallet', 'wallet');
  sync(); closeModal(); toast('Balance updated', 'ok'); render();
};
App.adminBan = async function (id) {

App.depApprove = async function (id) {
  const d = DB.deposits.find(x => x.id === id); if (!d || d.status !== 'pending') return;
  const u = findUser(d.userId); if (!u) return toast('User not found', 'err');
  d.status = 'approved'; d.reviewedAt = Date.now();
  u.balance = Math.round((u.balance + d.coins) * 100) / 100;
  u.totalDeposits = Math.round(((u.totalDeposits || 0) + d.usd) * 100) / 100;
  tx(u.id, 'deposit', 'Deposit approved · ' + (d.methodName || d.method), d.coins);
  notify(u.id, 'Deposit approved ✅', `${coins(d.coins)} WC has been credited to your wallet.`, '#/wallet', 'wallet');
  // referral payout on first approved deposit (idempotent)
  try { resolvePendingReferrals(); } catch (e) {}
  let bonus = false;
  try { bonus = referralBonus(u.id); } catch (e) {}
  sync();
  toast(bonus ? 'Deposit approved · 10 WC referral bonus paid' : 'Deposit approved and credited', 'ok');
  render();
};

  const d = DB.deposits.find(x => x.id === id); if (!d) return;

  d.status = 'rejected'; d.note = reason; d.reviewedAt = Date.now();
  notify(d.userId, 'Deposit rejected', `${usd(d.usd)} deposit was rejected. ${reason || ''}`, '#/wallet', 'ban');
  sync(); toast('Deposit rejected', 'ok'); render();
};

App.wdApprove = async function (id) {
  const w = DB.withdrawals.find(x => x.id === id); if (!w) return;
  const u = findUser(w.userId);
  const txRef = await promptDialog({ title: 'Approve withdrawal', label: 'Blockchain transaction hash (optional)', placeholder: '0x… or leave blank' });
  if (txRef === null) return;
  w.status = 'approved'; w.txHash = txRef; w.reviewedAt = Date.now();
  const act = DB.txs.find(t => t.id === w.txId || (t.meta && t.meta.withdrawalId === w.id));
  if (act) { act.label = 'Withdrawal approved · ' + w.network; act.meta = Object.assign({}, act.meta, { withdrawalId: w.id, status: 'approved' }); }
  if (u) {
    u.totalWithdrawals = Math.round(((u.totalWithdrawals || 0) + w.coins) * 100) / 100;
    notify(u.id, 'Withdrawal approved 💸', `${coins(w.coins)} WC (${usd(w.usd)}) was sent via ${w.network}.${txRef ? ' Tx: ' + txRef : ''}`, '#/wallet', 'download');
  }
  sync(); toast('Withdrawal approved', 'ok'); render();
};
App.wdReject = async function (id) {
  const w = DB.withdrawals.find(x => x.id === id); if (!w) return;
  const reason = await promptDialog({ title: 'Reject withdrawal', label: 'Reason (sent to user)', placeholder: 'Invalid wallet address' });
  if (reason === null) return;
  const u = findUser(w.userId);
  w.status = 'rejected'; w.note = reason; w.reviewedAt = Date.now();
  const actR = DB.txs.find(t => t.id === w.txId || (t.meta && t.meta.withdrawalId === w.id));
  if (actR) { actR.label = 'Withdrawal rejected · ' + w.network; actR.meta = Object.assign({}, actR.meta, { withdrawalId: w.id, status: 'rejected' }); }
  if (u) {
    u.balance = Math.round((u.balance + w.coins) * 100) / 100;
    tx(u.id, 'refund', 'Withdrawal rejected · refund', w.coins);
    notify(u.id, 'Withdrawal rejected', `${coins(w.coins)} WC has been returned to your balance. ${reason || ''}`, '#/wallet', 'ban');
  }
  sync(); toast('Withdrawal rejected and refunded', 'ok'); render();
};
App.wdEdit = function (id) {
  const w = DB.withdrawals.find(x => x.id === id); if (!w) return;
  openModal(modalShell('Edit withdrawal', `
    ${field('Amount (Whale Coin)', 'ewCoins', { type: 'number', value: w.coins })}
    <div class="field"><label class="label">Network</label><select class="input" id="ewNet">${(DB.settings.networks || []).map(n => `<option ${w.network === n ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></div>
    ${field('USDT address', 'ewAddr', { value: w.address })}
    ${field('Admin note', 'ewNote', { value: w.note || '' })}`,
    `<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" data-act="wd-save" data-id="${w.id}">Save changes</button>`));
};
App.wdSave = function (id) {
  const w = DB.withdrawals.find(x => x.id === id); if (!w) return;
  const coinsVal = Number(document.getElementById('ewCoins').value);
  const addr = document.getElementById('ewAddr').value.trim();
  if (!(coinsVal > 0) || !addr) return toast('Enter a valid amount and address', 'err');
  const u = findUser(w.userId);
  const diff = Math.round((coinsVal - w.coins) * 100) / 100;
  if (diff > 0 && u && u.balance < diff) return toast('User balance too low for this increase', 'err');
  if (u && diff !== 0) { u.balance = Math.round((u.balance - diff) * 100) / 100; tx(u.id, 'withdrawal', 'Withdrawal adjusted by admin', -diff); }
  w.coins = coinsVal; w.usd = coinsToUsd(coinsVal);
  w.network = document.getElementById('ewNet').value;
  w.address = addr;
  w.note = document.getElementById('ewNote').value.trim();
  // keep the user's activity row in sync with admin edits
  const linked = DB.txs.find(t => t.id === w.txId || (t.meta && t.meta.withdrawalId === w.id));
  if (linked && (w.status === 'pending' || w.status === 'approved')) {
    linked.coins = -w.coins;
    linked.label = (w.status === 'approved' ? 'Withdrawal approved · ' : 'Withdrawal request · ') + w.network;
    linked.meta = Object.assign({}, linked.meta, { withdrawalId: w.id, network: w.network, editedByAdmin: true });
  }
  if (u) notify(u.id, 'Withdrawal request updated', `Your ${coins(w.coins)} WC withdrawal was updated by our team (${w.network}).`, '#/wallet', 'download');
  sync(); closeModal(); toast('Withdrawal updated', 'ok'); render();
};
App.wdDel = async function (id) {
  if (!await confirmDialog({ title: 'Delete withdrawal history?', body: 'This removes the record only; funds already approved are not affected.', danger: true, ok: 'Delete' })) return;
  DB.withdrawals = DB.withdrawals.filter(w => w.id !== id); sync(); render();
};

App.adminSendNotif = function () {
  const to = document.getElementById('anUser').value;
  const title = document.getElementById('anTitle').value.trim();
  const body = document.getElementById('anBody').value.trim();
  if (!title || !body) return toast('Title and message are required', 'err');
  if (to === 'all') {
    DB.users.filter(u => u.role !== 'admin').forEach(u => notify(u.id, title, body, null, 'bell'));
    toast('Notification sent to ' + DB.users.filter(u => u.role !== 'admin').length + ' users', 'ok');
  } else { notify(to, title, body, null, 'bell'); toast('Notification sent', 'ok'); }
  sync(); render();
};

App.adminNotifEdit = function (id) {
  const n = DB.notifications.find(x => x.id === id); if (!n) return;
  openModal(modalShell('Edit notification', `${field('Title', 'enTitle', { value: n.title })}
    <div class="field"><label class="label">Message</label><textarea class="input" id="enBody" style="min-height:90px">${esc(n.body)}</textarea></div>`,
    `<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" data-act="admin-notif-save" data-id="${n.id}">Save</button>`));
};
App.adminNotifSave = function (id) {
  const n = DB.notifications.find(x => x.id === id); if (!n) return;
  n.title = document.getElementById('enTitle').value.trim() || n.title;
  n.body = document.getElementById('enBody').value.trim() || n.body;
  sync(); closeModal(); toast('Notification updated', 'ok'); render();
};
App.adminNotifDel = async function (id) {
  if (!await confirmDialog({ title: 'Delete notification?', danger: true, ok: 'Delete' })) return;
  DB.notifications = DB.notifications.filter(n => n.id !== id); sync(); render();
};

/* ---------------- payment settings ---------------- */
function adminSettings() {
  const s = DB.settings;
  return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px" class="dash2">
    <div class="card">
      <div class="between mb16"><h3 style="font-size:15px">Crypto deposit methods</h3>
        <button class="btn btn-sm btn-primary" data-act="crypto-new">${ic('plus', 14)} Add</button></div>
      ${(s.crypto || []).length ? (s.crypto || []).map(m => `<div class="list-item" style="align-items:flex-start">
        <div style="width:30px;height:30px;border-radius:8px;background:rgba(255,176,32,.13);color:var(--warn);display:flex;align-items:center;justify-content:center;flex:none">${ic('wallet', 14)}</div>
        <div class="grow" style="min-width:0"><div class="small" style="font-weight:650">${esc(m.name)}</div>
          <div class="tiny muted" style="word-break:break-all">${esc(m.address)}</div>
          ${m.note ? `<div class="tiny" style="color:var(--warn)">${esc(m.note)}</div>` : ''}</div>

        <button class="btn btn-xs btn-ghost" data-act="crypto-del" data-id="${m.id}">${ic('trash', 11)}</button></div></div>`).join('') : '<p class="tiny muted">No crypto methods.</p>'}

    <div class="card">

        <button class="btn btn-sm btn-primary" data-act="bank-new">${ic('plus', 14)} Add</button></div>
      ${(s.banks || []).length ? (s.banks || []).map(b => `<div class="list-item" style="align-items:flex-start">
        <div style="width:30px;height:30px;border-radius:8px;background:rgba(58,160,255,.13);color:var(--accent-2);display:flex;align-items:center;justify-content:center;flex:none">${ic('store', 14)}</div>
        <div class="grow" style="min-width:0"><div class="small" style="font-weight:650">${esc(b.bankName)}</div>

        <button class="btn btn-xs btn-ghost" data-act="bank-del" data-id="${b.id}">${ic('trash', 11)}</button></div></div>`).join('') : '<p class="tiny muted">No bank methods.</p>'}
    </div>
  </div>
  <div class="card mt16">
    <div class="between mb16"><h3 style="font-size:15px">USDT withdrawal networks</h3>
      <button class="btn btn-sm btn-primary" data-act="network-add">${ic('plus', 14)} Add network</button></div>
    <div class="row wrap gap8">${(s.networks || []).map(n => `<span class="badge" style="padding:7px 10px;font-size:12px">${esc(n)}
      <button data-act="network-del" data-id="${esc(n)}" style="color:var(--danger);margin-left:4px">${ic('x', 11)}</button></span>`).join('')}</div>
    <div class="divider"></div>
    <div class="field"><label class="label">Deposit instructions note</label><textarea class="input" id="asDepNote" style="min-height:70px">${esc(s.depositNote || '')}</textarea></div>
    <div class="row gap8"><button class="btn btn-primary btn-sm" data-act="save-settings">${ic('check', 14)} Save payment settings</button>
      <button class="btn btn-ghost btn-sm" data-act="edit-networks">Manage networks</button></div>
  </div>
  <div class="card mt16">
    <div class="between wrap gap10">
      <div><h3 style="font-size:15px">Vendor plans & activation fees</h3>
        <p class="tiny muted mt6">Applicants pick a duration, pay its fee to the company account and upload a slip. Vendors freeze automatically when their plan ends.</p></div>

/* ---------------- refund approvals ---------------- */
App.refundApprove = async function (id) {
  const r = (DB.refunds || []).find(x => x.id === id);
  if (!r || r.status !== 'pending') return;
  const v = vendorById(r.vendorId);
  const vu = v ? findUser(v.userId) : null;
  const inv = DB.products.find(x => x.id === r.inventoryId);
  const company = DB.companyProducts.find(c => c.id === r.companyProductId);
  if (!vu) return toast('Vendor account not found', 'err');
  if (!inv || inv.stock < r.qty) return toast('Cannot approve — vendor no longer holds all ' + r.qty + ' units', 'err');
  if (!await confirmDialog({ title: 'Approve refund?', body: `Return ${r.qty} × ${r.name} to company stock and credit ${coins(r.coins)} WC to @${v.username}?`, ok: 'Approve refund' })) return;

  inv.stock -= r.qty;
  if (inv.stock <= 0) DB.products = DB.products.filter(x => x.id !== inv.id);
  if (company) company.stock += r.qty;

  vu.balance = Math.round((Number(vu.balance || 0) + r.coins) * 100) / 100;
  tx(vu.id, 'refund', 'Company refund · ' + r.name + ' ×' + r.qty, r.coins, { refundId: r.id });
  const purchase = (DB.purchases || []).find(x => x.id === r.purchaseId);
  if (purchase) { purchase.status = 'refunded'; purchase.refundedAt = Date.now(); }
  r.status = 'approved'; r.reviewedAt = Date.now(); r.reviewedBy = me().id;
  notify(vu.id, 'Refund approved 💸', `${coins(r.coins)} WC has been credited back to your balance for ${r.qty} × ${r.name}.`, '#/wallet', 'refresh');
  notify('usr_admin', 'Refund completed', `${r.qty} × ${r.name} returned to company stock · ${coins(r.coins)} WC refunded to @${v.username}.`, '#/admin/refunds', 'check');
  sync();
  toast('Refund approved — stock restored and balance credited', 'ok', 3600);
  render();
};

    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'whalechat-backup-' + new Date().toISOString().slice(0, 10) + '.json';

    toast('Backup downloaded', 'ok');

App.adminBackupRestore = function () {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'application/json,.json';
  input.onchange = async () => {
    const file = input.files && input.files[0];
    if (!file) return;
    let data = null;
    try { data = JSON.parse(await file.text()); } catch (e) { return toast('That file is not valid JSON', 'err'); }
    const db = data && data.db ? data.db : data;
    if (!db || !Array.isArray(db.users) || !db.users.length) return toast('Backup contains no accounts — restore cancelled', 'err');
    if (!await confirmDialog({
      title: 'Restore this backup?',
      body: 'This replaces the live database with ' + db.users.length + ' accounts from the file. The current database is backed up first. Publishing builds never does this automatically.',
      danger: true, ok: 'Restore backup'
    })) return;
    try {
      const r = await fetch('/api/state/restore', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ db })
      }).then(x => x.json());
      if (!r.ok) throw new Error(r.error || 'restore failed');
      try { const keys = await caches.keys(); await Promise.all(keys.map(k => caches.delete(k))); } catch (e) {}
      toast('Database restored · reloading…', 'ok');
      setTimeout(() => location.reload(), 900);
    } catch (e) { toast('Restore failed: ' + e.message, 'err'); }
  };
  input.click();
};

function appLink() {
  if (window.__WC_SERVER__) return location.origin + '/';
  return location.origin + location.pathname;
}
function referralLink(code) {
  const c = encodeURIComponent(String(code || '').toUpperCase());
  if (window.__WC_SERVER__) return location.origin + '/ref/' + c;
  return location.origin + location.pathname + '#/ref=' + c;
}
function referralFromURL() {
  let code = null;
  const m = location.pathname.match(/\/(?:ref|r)[=\/]([A-Za-z0-9_-]{3,24})\/?$/i);
  if (m) code = m[1];
  if (!code) {
    try { const q = new URLSearchParams(location.search); if (q.get('ref')) code = q.get('ref'); } catch (e) {}
  }
  if (!code) {
    const h = location.hash || '';
    const hm = h.match(/(?:ref|r)[=\/]([A-Za-z0-9_-]{3,24})/i);
    if (hm) code = hm[1];
  }
  return code ? String(code).toUpperCase() : null;
}

let UPDATE_READY = false;
let UPDATE_TIMER = null;

async function checkForUpdates(manual) {
  if (!APP_BUILD || !/^\d{4}-\d{2}-\d{2}T/.test(APP_BUILD)) {
    if (manual) toast('You are running the latest version', 'ok');
    return false;
  }
  let v = null;
  for (const name of ['release.json', 'version.json']) {
    try {
      const res = await fetch(name + '?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) continue;
      const data = await res.json();
      if (data && data.build) { v = data; break; }
    } catch (e) { /* try next manifest */ }
  }
  if (!v) { if (manual) toast('Update check is unavailable right now', 'err'); return false; }
  if (v.build > APP_BUILD) {
    showUpdateBar(v);
    if (manual) toast('A new version is ready — update to get it', 'ok');
    return true;
  }
  if (manual) toast('You are running the latest version', 'ok');
  return false;
}

function showUpdateBar(v) {
  if (UPDATE_READY || document.getElementById('updateBar')) return;
  UPDATE_READY = true;
  const bar = document.createElement('div');
  bar.className = 'update-bar';
  bar.id = 'updateBar';
  bar.innerHTML = `<span class="dot" style="background:var(--accent)"></span>
    <div style="flex:1;min-width:0"><div class="small" style="font-weight:650">New WhaleChat version ready</div>
    <div class="tiny" style="color:#9cb6c6">Version ${esc(v.version || '')} · updating in a moment</div></div>
    <button class="btn btn-primary btn-xs" id="updateNow">Update now</button>
    <button class="btn-icon" id="updateLater" style="width:28px;height:28px" title="Later">${ic('x', 13)}</button>`;
  document.body.appendChild(bar);
  document.getElementById('updateNow').onclick = applyUpdate;
  document.getElementById('updateLater').onclick = () => { clearTimeout(UPDATE_TIMER); bar.remove(); UPDATE_READY = false; };
  UPDATE_TIMER = setTimeout(applyUpdate, 20000);
}

async function applyUpdate() {
  clearTimeout(UPDATE_TIMER);
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.update().catch(() => {})));
      regs.forEach(r => { if (r.waiting) r.waiting.postMessage({ type: 'SKIP_WAITING' }); });
    }
  } catch (e) {}
  try {
    if (window.caches) { const keys = await caches.keys(); await Promise.all(keys.map(k => caches.delete(k))); }
  } catch (e) {}
  location.reload();
}
